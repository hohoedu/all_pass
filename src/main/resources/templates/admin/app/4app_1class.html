<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Custom Css / Js -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/media.css">
  <script src="js/custom.js"></script>
  <!-- Html menu Load -->
  <script src="js/loadHTML.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <title>수업 전/후 알림</title>
</head>

<body>
  <div class="main-container">
    <!-- header -->
    <div class="main-frame">
      <!-- left nav bar -->
      <aside id="sidebar-load"></aside>
      <main class="main-info">
        <div class="student-frame time-regist-frame">
          <!-- section:top -->
          <section>
            <div class="class-desc">
              <div class="class-header">
                <div class="common-title">
                  <h2>수업 전/후 알림</h2>
                </div>
                <div class="class-btns">
                  <div class="common-btn record-save">저장</div>
                </div>
              </div>
            </div>
          </section>
          <!-- section:bottom -->
          <div class="second-frame" style="padding: 0 15px;">
            <section class="class-log-left2">
              <h4 style="margin-bottom: 20px;">단계 선택</h4>
              <ul class="table-frame class-list">
                <li class="class-btn active" data-class-id="영재">영재</li>
                <li class="class-btn" data-class-id="수재">수재</li>
                <li class="class-btn" data-class-id="신동">신동</li>
                <li class="class-btn" data-class-id="초등수재">초등수재</li>
                <li class="class-btn" data-class-id="초등신동">초등신동</li>
                <li class="class-btn" data-class-id="초등박사">초등박사</li>
                <li class="class-btn" data-class-id="한스쿨-기본">한스쿨-기본</li>
                <li class="class-btn" data-class-id="한스쿨-중급">한스쿨-중급</li>
                <li class="class-btn" data-class-id="한스쿨-상급">한스쿨-상급</li>
                <li class="class-btn" data-class-id="한스쿨-고급">한스쿨-고급</li>
                <li class="class-btn" data-class-id="한스쿨-심화">한스쿨-심화</li>
                <li class="class-btn" data-class-id="키움">키움</li>
                <li class="class-btn" data-class-id="만남">만남</li>
                <li class="class-btn" data-class-id="자람">자람</li>
                <li class="class-btn" data-class-id="새움">새움</li>
                <li class="class-btn" data-class-id="다움">다움</li>
                <li class="class-btn" data-class-id="티움">티움</li>
                <li class="class-btn" data-class-id="채움">채움</li>
                <li class="class-btn" data-class-id="수재">북스쿨-5학년</li>
                <li class="class-btn" data-class-id="수재">북스쿨-6학년</li>
              </ul>
            </section>
            <section class="class-log-right class-log-right2">
              <div class="book-frame">
                <ul class="table-frame book-list">
                  <li class="class-btn2 active" data-class-id="1호">1호</li>
                  <li class="class-btn2" data-class-id="2호">2호</li>
                  <li class="class-btn2" data-class-id="3호">3호</li>
                  <li class="class-btn2" data-class-id="4호">4호</li>
                  <li class="class-btn2" data-class-id="5호">5호</li>
                </ul>
              </div>
              <div class="small-title">수업 전 안내</div>
              <table class="base-info-t">
                <tbody>
                  <tr>
                    <th>1주</th>
                    <td>
                      <textarea></textarea>
                    </td>
                    <th>2주</th>
                    <td>
                      <textarea></textarea>
                    </td>
                  </tr>
                  <tr>
                    <th>3주</th>
                    <td>
                      <textarea></textarea>
                    </td>
                    <th>4주</th>
                    <td>
                      <textarea></textarea>
                    </td>
                  </tr>
                </tbody>
              </table>
              <div class="small-title">수업 후 안내</div>
              <table class="base-info-t">
                <tbody>
                  <tr>
                    <th>1주</th>
                    <td>
                      <textarea></textarea>
                    </td>
                    <th>2주</th>
                    <td>
                      <textarea></textarea>
                    </td>
                  </tr>
                  <tr>
                    <th>3주</th>
                    <td>
                      <textarea></textarea>
                    </td>
                    <th>4주</th>
                    <td>
                      <textarea></textarea>
                    </td>
                  </tr>
                </tbody>
              </table>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>

</html>
