<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/admin/app/book_suggest.js}"></script>

    <!-- Html menu Load -->
    <script th:src="@{/js/sidebar.js}"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <title>수업도서</title>
</head>

<body>
<div class="main-container">
    <!-- header -->
    <div class="main-frame">
        <!-- left nav bar -->
        <aside th:replace="~{admin/admin-sidebar :: adminSidebar}"></aside>
        <main class="main-info">
            <div class="student-frame time-regist-frame">
                <!-- section:top -->
                <section>
                    <div class="class-desc">
                        <div class="class-header">
                            <div class="common-title">
                                <h2>수업도서</h2>
                            </div>
                            <div class="class-btns">
                                <div class="common-btn record-save" id="book-save">저장</div>
                            </div>
                        </div>
                    </div>
                </section>
                <!-- section:bottom -->
                <div class="second-frame" style="padding: 0 15px;">
                    <section class="class-log-left2">
                        <h4 style="margin-bottom: 20px;">단계 선택</h4>
                        <ul class="table-frame class-list">
                            <li th:each="c : ${classCodes}"
                                class="class-btn"
                                th:data-key="${c.classKey}"
                                th:text="${c.className}">
                            </li>
                        </ul>
                    </section>
                    <section class="class-log-right class-log-right2">
                        <div class="book-frame">
                            <ul class="table-frame book-list">
                                <li class="class-btn2 active" data-class-id="1월">1월</li>
                                <li class="class-btn2" data-class-id="2월">2월</li>
                                <li class="class-btn2" data-class-id="3월">3월</li>
                                <li class="class-btn2" data-class-id="4월">4월</li>
                                <li class="class-btn2" data-class-id="5월">5월</li>
                                <li class="class-btn2" data-class-id="6월">6월</li>
                                <li class="class-btn2" data-class-id="7월">7월</li>
                                <li class="class-btn2" data-class-id="8월">8월</li>
                                <li class="class-btn2" data-class-id="9월">9월</li>
                                <li class="class-btn2" data-class-id="10월">10월</li>
                                <li class="class-btn2" data-class-id="11월">11월</li>
                                <li class="class-btn2" data-class-id="12월">12월</li>
                            </ul>
                        </div>
                        <div th:each="week : ${#numbers.sequence(1,4)}">
                            <div class="small-title" th:text="${week + '주'}"></div>

                            <table class="base-info-t" style="max-width:900px;" th:attr="data-week=${week}">
                                <colgroup>
                                    <col width="15%">
                                    <col width="35%">
                                    <col width="15%">
                                    <col width="35%">
                                </colgroup>

                                <tbody>
                                <tr>
                                    <th>주제</th>
                                    <td>
                                        <div class="select-wrap">
                                            <select name="subject" class="styled-select"
                                                    th:id="'subject-' + ${week}">
                                                <option value="">주제 선택</option>
                                                <option th:each="s : ${subjects}"
                                                        th:value="${s.subjectKey}"
                                                        th:text="${s.subjectName}">
                                                </option>
                                            </select>
                                        </div>
                                    </td>

                                    <th>출판사</th>
                                    <td>
                                        <div class="td-inputs">
                                            <input type="text" th:id="'publisher-' + ${week}" placeholder="출판사를 입력하세요.">
                                        </div>
                                    </td>
                                </tr>

                                <tr>
                                    <th>도서명</th>
                                    <td>
                                        <div class="td-inputs">
                                            <input type="text" th:id="'bookName-' + ${week}" placeholder="도서명을 입력하세요.">
                                        </div>
                                    </td>

                                    <th>이미지</th>
                                    <td>
                                        <label class="file-upload">
                                            파일 선택
                                            <input type="file" th:id="'file-' + ${week}" hidden>
                                        </label>
                                        <span class="file-name" th:id="'file-name-' + ${week}">이미지</span>
                                        <input type="hidden" th:id="'imagePath-' + ${week}">
                                        <span class="file-remove">X</span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>
</body>

</html>
