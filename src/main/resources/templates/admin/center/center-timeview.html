<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Custom Css / Js -->
  <link rel="stylesheet" th:href="@{/css/admin-style.css}">
  <link rel="stylesheet" th:href="@{/css/media.css}">
  <script th:src="@{/js/custom.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:src="@{/js/admin/center/center_timeview.js}" defer></script>
  <title>학원 시간표 조회</title>
</head>

<body>
  <div class="main-container">
    <div class="main-frame">
      <aside th:replace="~{admin/admin-sidebar :: adminSidebar}"></aside>
      <main class="main-info">
        <div class="student-frame time-regist-frame">
          <!-- section:top -->
          <section>
            <div class="class-desc">
              <div class="class-header">
                <div class="common-title">
                  <h2>학원 시간표 조회</h2>
                </div>
                <div class="class-btns">
                  <div class="common-btn" id="openWeekModalBtn" style="background:#7a5af8;border-color:#7a5af8;">주차 확인</div>
                  <div class="common-btn record-save">인쇄</div>
                </div>
              </div>
              <div class="month-header2 month-today" style="padding: 10px 0;">
                <div class="month-title2">
                  <span id="monthDisplay" class="current-month" th:text="${year + '. ' + month}"></span>
                  <div class="calendar-wrapper">
                    <input type="month" id="monthPicker" class="hidden-date" th:value="${year + '-' + month}" />
                    <button type="button" class="icon-btn calendar-open calendar-btn" data-picker="monthPicker">
                      <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <!-- section:bottom -->
          <div class="second-frame" style="padding: 0 15px;">
            <section class="ebook-code-left">
              <div class="student-content">
                <h4>학원 선택</h4>
                <div class="mt">
                  <div class="table-frame stu-chocie-frame">
                    <table class="basic-table stu-chocie-table stripe">
                      <thead>
                        <tr>
                          <th><img th:src="@{/image/sort_checked.svg}" alt="" class="svg-sort">지점명</th>
                          <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">상태</th>
                        </tr>
                      </thead>
                      <tbody class="stripe">
                        <colgroup>
                          <col width="60%">
                          <col width="40%">
                        </colgroup>
                        <tr class="center-item" th:each="c : ${center}"
                          th:if="${c.centerCode != 'PUS001' and c.centerCode != 'ALL'}"
                          th:attr="data-center-code=${c.centerCode}">
                          <td class="stu-badge"><span class="center-name" th:text="${c.centerName}">지점명</span></td>
                          <td th:text="${c.status == 'open' ? '사용중' : '미사용'}">사용중</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </section>
            <section class="ebook-code-right" style="margin-top:-65px;">
              <div class="manager-list-frame">
                <div class="month-header month-today" style="align-items: end;">
                  <!-- <div class="month-title">
                    <span class="current-month"></span>
                    <div class="calendar-wrapper">
                      <input type="date" class="hidden-date" />
                      <button type="button" class="icon-btn calendar-open">
                        <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                      </button>
                    </div>
                  </div> -->
                  <div class="basic-select">
                    <select name="teacher" id="teacherSelect" style="width: 200px;">
                      <option value="" disabled selected>센터를 선택해주세요</option>
                    </select>
                  </div>
                </div>
                <!-- table -->
                <table class="timetable-lookup-table">
                  <thead>
                    <tr>
                      <th style="padding: 0;">교시</th>
                      <th>월</th>
                      <th>화</th>
                      <th>수</th>
                      <th>목</th>
                      <th>금</th>
                      <th>토</th>
                    </tr>
                  </thead>
                  <tbody>
                  </tbody>
                </table>
                <!-- table : 회원 현황 -->
                <!-- <table class="member-status-table">
                  <thead>
                    <tr>
                      <th colspan="3">회원현황</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>입회</td>
                      <td>1</td>
                      <td>양찬희</td>
                    </tr>
                    <tr>
                      <td>탈퇴</td>
                      <td>1</td>
                      <td>강하연</td>
                    </tr>
                    <tr>
                      <td>전입</td>
                      <td>2</td>
                      <td>김하니(한), 박윤아(독)</td>
                    </tr>
                    <tr>
                      <td>전출</td>
                      <td>2</td>
                      <td>이도현(한), 정서호(독)</td>
                    </tr>
                    <tr>
                      <td>1-3주</td>
                      <td>1</td>
                      <td>박지환(3주)</td>
                    </tr>
                    <tr>
                      <td>주의필요</td>
                      <td>2</td>
                      <td>손하윤, 김희수</td>
                    </tr>
                  </tbody>
                  <tfoot>
                    <tr>
                      <td colspan="2" class="in-all">총원</td>
                      <td><span class="pax-people">30</span></td>
                    </tr>
                  </tfoot>
                </table> -->
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
<!-- 수업 주차 설정 모달 -->
<div id="weekModal" class="week-modal-overlay">
  <div class="week-modal-box">
    <span class="week-modal-close">&times;</span>
    <h2 class="week-modal-title">주차 확인</h2>
    <div class="week-modal-week-buttons">
      <button class="week-modal-week-btn week-modal-week1" data-week="1">1주차</button>
      <button class="week-modal-week-btn week-modal-week2" data-week="2">2주차</button>
      <button class="week-modal-week-btn week-modal-week3" data-week="3">3주차</button>
      <button class="week-modal-week-btn week-modal-week4" data-week="4">4주차</button>
    </div>
    <div class="week-modal-calendar-container">
      <div class="week-modal-calendar-header">
        <button id="calendarPrevBtn">&lt;</button>
        <span id="calendarMonthLabel"></span>
        <button id="calendarNextBtn">&gt;</button>
      </div>
      <div class="week-modal-calendar-weekdays">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>
      <div id="calendarGrid" class="week-modal-calendar-grid"></div>
    </div>
  </div>
</div>
</body>

</html>
