<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <link rel="stylesheet" th:href="@{/css/admin/2logistics_2order.css}">
    <link rel="stylesheet" th:href="@{/css/admin/center_timeview.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/admin/center/center_timeview.js}" defer></script>
    <title>센터별 시간표</title>
</head>

<body>
    <div class="app-shell" id="appShell">
        <aside th:replace="~{admin/admin-sidebar :: adminSidebar}"></aside>

        <header class="header">
            <h1 class="page-title">센터별 시간표</h1>
        </header>

        <main class="content">
            <section class="filter-card" aria-label="조회 조건">
                <div class="filter-left">
                    <div class="field">
                        <label for="centerSelect">센터 선택</label>
                        <div class="select-field">
                            <select id="centerSelect">
                                <option value="">센터를 선택해주세요</option>
                                <th:block th:each="c : ${center}">
                                    <option th:if="${c.centerCode != 'PUS001' and c.centerCode != 'ALL'}"
                                        th:value="${c.centerCode}"
                                        th:text="${#strings.replace(c.centerName, '호호서당 ', '')}">센터명</option>
                                </th:block>
                            </select>
                        </div>
                    </div>
                    <div class="field">
                        <label for="monthDisplay">수강 월 조회</label>
                        <div class="date-field">
                            <input id="monthDisplay" type="text" th:value="${year + '년 ' + month + '월'}" readonly />
                            <button class="calendar-btn" type="button" data-picker="monthPicker"
                                aria-label="수강 월 선택">
                                <i class="fa-regular fa-calendar"></i>
                            </button>
                            <input class="hidden-picker" id="monthPicker" type="month"
                                th:value="${year + '-' + month}" />
                        </div>
                    </div>
                    <div class="field">
                        <label for="subjectSelect">과목 선택</label>
                        <div class="select-field">
                            <select id="subjectSelect">
                                <option value="">전체</option>
                                <option value="han">한스쿨</option>
                                <option value="book">북스쿨</option>
                                <option value="hoho">호호스쿨</option>
                            </select>
                        </div>
                    </div>
                    <div class="field">
                        <label for="teacherSelect">선생님 선택</label>
                        <div class="select-field">
                            <select id="teacherSelect">
                                <option value="">전체</option>
                            </select>
                        </div>
                    </div>
                    <button class="primary-btn" type="button" id="searchBtn">조회</button>
                    <button class="outline-btn reset-btn" type="button" id="resetFilterBtn">
                        <i class="fa-solid fa-rotate-left"></i>필터 초기화
                    </button>
                </div>
                <div class="filter-right">
                    <button class="outline-btn" type="button" id="centerPrintBtn">센터 전체 출력</button>
                    <button class="outline-btn" type="button" id="excelDownloadBtn">엑셀 내려받기</button>
                </div>
            </section>

            <section class="workspace">
                <section class="order-detail" aria-label="시간표 영역">
                    <section class="panel change-panel">
                        <div class="panel-head">
                            <h2 class="panel-title">
                                <span id="timetableTitleMonth" th:text="${year + '년 ' + month + '월'}"></span> 시간표 -
                                <span id="timetableTitleTeacher">전체</span>
                            </h2>
                            <div class="panel-head-actions">
                                <ul class="subject-legend" aria-label="과목 범례">
                                    <li class="han">한스쿨</li>
                                    <li class="book">북스쿨</li>
                                    <li class="hoho">호호스쿨</li>
                                </ul>
                                <button class="outline-btn panel-head-btn" type="button" id="timetablePrintBtn">
                                    <i class="fa-solid fa-print"></i>인쇄
                                </button>
                            </div>
                        </div>
                        <div class="table-wrap">
                            <table class="timetable-table">
                                <colgroup>
                                    <col style="width: 64px">
                                    <col>
                                    <col>
                                    <col>
                                    <col>
                                    <col>
                                    <col>
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>교시</th>
                                        <th>월</th>
                                        <th>화</th>
                                        <th>수</th>
                                        <th>목</th>
                                        <th>금</th>
                                        <th>토</th>
                                    </tr>
                                </thead>
                                <tbody id="timetableBody">
                                    <tr data-period="1">
                                        <th class="period-cell">1교시</th>
                                        <td data-day="mon"></td>
                                        <td data-day="tue"></td>
                                        <td data-day="wed"></td>
                                        <td data-day="thu"></td>
                                        <td data-day="fri"></td>
                                        <td data-day="sat"></td>
                                    </tr>
                                    <tr data-period="2">
                                        <th class="period-cell">2교시</th>
                                        <td data-day="mon"></td>
                                        <td data-day="tue"></td>
                                        <td data-day="wed"></td>
                                        <td data-day="thu"></td>
                                        <td data-day="fri"></td>
                                        <td data-day="sat"></td>
                                    </tr>
                                    <tr data-period="3">
                                        <th class="period-cell">3교시</th>
                                        <td data-day="mon"></td>
                                        <td data-day="tue"></td>
                                        <td data-day="wed"></td>
                                        <td data-day="thu"></td>
                                        <td data-day="fri"></td>
                                        <td data-day="sat"></td>
                                    </tr>
                                    <tr data-period="4">
                                        <th class="period-cell">4교시</th>
                                        <td data-day="mon"></td>
                                        <td data-day="tue"></td>
                                        <td data-day="wed"></td>
                                        <td data-day="thu"></td>
                                        <td data-day="fri"></td>
                                        <td data-day="sat"></td>
                                    </tr>
                                    <tr data-period="5">
                                        <th class="period-cell">5교시</th>
                                        <td data-day="mon"></td>
                                        <td data-day="tue"></td>
                                        <td data-day="wed"></td>
                                        <td data-day="thu"></td>
                                        <td data-day="fri"></td>
                                        <td data-day="sat"></td>
                                    </tr>
                                    <tr data-period="6">
                                        <th class="period-cell">6교시</th>
                                        <td data-day="mon"></td>
                                        <td data-day="tue"></td>
                                        <td data-day="wed"></td>
                                        <td data-day="thu"></td>
                                        <td data-day="fri"></td>
                                        <td data-day="sat"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </section>

                <section class="status-area" aria-label="현황 영역">
                    <section class="panel status-panel" aria-labelledby="class-status-heading">
                        <div class="panel-head">
                            <h2 id="class-status-heading" class="panel-title">수업 현황</h2>
                        </div>
                        <div class="status-body" id="classStatusBody">
                            <ul class="status-list">
                                <li class="status-row" data-gb="entry">
                                    <div class="status-line"><span>입회</span><strong class="status-value">-</strong></div>
                                </li>
                                <li class="status-row" data-gb="inactive">
                                    <div class="status-line"><span>탈퇴</span><strong class="status-value">-</strong></div>
                                </li>
                                <li class="status-row" data-gb="move_in">
                                    <div class="status-line"><span>전입</span><strong class="status-value">-</strong></div>
                                </li>
                                <li class="status-row" data-gb="move_out">
                                    <div class="status-line"><span>전출</span><strong class="status-value">-</strong></div>
                                </li>
                                <li class="status-row total">
                                    <div class="status-line"><span>총인원</span><strong class="status-value" id="statusTotalStudents">-</strong></div>
                                </li>
                                <li class="status-row total">
                                    <div class="status-line"><span>총 수업 수</span><strong class="status-value" id="statusTotalClasses">-</strong></div>
                                </li>
                                <li class="status-row total">
                                    <div class="status-line"><span>총 교재 수량</span><strong class="status-value" id="statusTotalBooks">-</strong></div>
                                </li>
                            </ul>
                        </div>
                    </section>

                    <section class="panel status-panel" aria-labelledby="book-status-heading">
                        <div class="panel-head">
                            <h2 id="book-status-heading" class="panel-title">교재 현황</h2>
                        </div>
                        <div class="status-body" id="bookStatusBody">
                            <p class="status-empty">선생님을 선택하면 교재 현황이 표시됩니다.</p>
                        </div>
                    </section>
                </section>
            </section>
        </main>
    </div>
</body>

</html>
