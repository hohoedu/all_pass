<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Custom Css / Js -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/media.css">
  <script src="js/custom.js"></script>
  <!-- Html menu Load -->
  <script src="js/loadHTML.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <title>학원 정보</title>
</head>

<body>
  <div class="main-container">
    <!-- header -->
    <div class="main-frame">
      <!-- left nav bar -->
      <aside id="sidebar-load"></aside>
      <main class="main-info">
        <div class="student-frame time-regist-frame">
          <!-- section:top -->
          <section>
            <div class="class-desc">
              <div class="class-header">
                <div class="common-title">
                  <h2>학원 정보</h2>
                </div>
                <div class="class-btns">
                  <div class="common-btn record-save">저장</div>
                </div>
              </div>
              <div class="month-header2 month-today" style="padding: 10px 0;">
                <div class="month-title2">
                  <span class="current-month"></span>
                  <div class="calendar-wrapper">
                    <input type="month" class="hidden-date" />
                    <button type="button" class="icon-btn calendar-open">
                      <img src="image/calendar.png" alt="달력 아이콘">
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <!-- section:bottom -->
          <div class="second-frame" style="padding: 0 15px;">
            <section class="ebook-code-left">
              <div class="student-content">
                <h4>학원 선택</h4>
                <div class="mt">
                  <div class="table-frame stu-chocie-frame">
                    <table class="basic-table stu-chocie-table stripe">
                      <thead>
                        <tr>
                          <th><img src="image/sort_checked.svg" alt="" class="svg-sort">지점명
                          </th>
                          <th><img src="image/sort.svg" alt="" class="svg-sort">상태</th>
                        </tr>
                      </thead>
                      <tbody id="" class="stripe">
                        <colgroup>
                          <col width="60%">
                          <col width="40%">
                        </colgroup>
                        <tr>
                          <td class="stu-badge"><span class="names">부산 남천점</span></td>
                          <td>사용중</td>
                        </tr>
                        <tr>
                          <td class="stu-badge"><span class="names">대구 월성점</span></td>
                          <td>사용중</td>
                        </tr>
                        <tr>
                          <td class="stu-badge"><span class="names">울산 유곡점</span></td>
                          <td>사용중</td>
                        </tr>
                        <tr>
                          <td class="stu-badge"><span class="names">서울 대치점</span></td>
                          <td>미사용</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </section>
            <section class="ebook-code-right">
              <div class="small-title"><span>부산 남천점</span> 정보</div>
              <table class="base-info-t">
                <colgroup>
                  <col width="15%">
                  <col width="35%">
                  <col width="15%">
                  <col width="35%">
                </colgroup>
                <tbody>
                  <tr>
                    <th>지점 코드</th>
                    <td><input type="text" name="centercode" value="00021"></td>
                    <th>개원일자</th>
                    <td class="icon-field day-picker" style="position: relative;">
                      <div class="day-display"></div> <!-- 표시 영역 -->
                      <div>
                        <input type="date" class="birth-input hidden-picker" />
                        <button type="button" class="icon-btn birth-btn">
                          <img src="image/calendar.png" alt="달력 아이콘" />
                        </button>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <th>지점 ID</th>
                    <td>
                      <input type="text" name="centerID" value="HOHO21">
                    </td>
                    <th>지점 PW</th>
                    <td>
                      <input type="text" name="centerPW" value="HOHO21">
                    </td>
                  </tr>
                  <tr>
                    <th class="tuition-fee">원장님명</th>
                    <td>
                      <input type="text" name="centerID" value="김원장">
                    </td>
                    <th>원장님 연락처</th>
                    <td>
                      <input type="text" name="centerID" value="01012345678">
                    </td>
                  </tr>
                  <tr>
                    <th class="tuition-fee">사업자 번호</th>
                    <td>
                      <input type="text" name="centerID" value="322-88-00028">
                    </td>
                    <th>학원 연락처</th>
                    <td>
                      <input type="text" name="centerID" value="051-123-4567">
                    </td>
                  </tr>
                  <tr>
                    <th class="tuition-fee">우편번호</th>
                    <td class="icon-field">
                      <input type="text" name="address" value="부산 해운대구 센텀중앙로 97">
                      <button type="button" class="icon-btn">
                        <img src="image/search.png" alt="검색 아이콘">
                      </button>
                    </td>
                    <th>팩스</th>
                    <td>
                      <input type="text" name="centerID" value="0511234567">
                    </td>
                  </tr>
                  <tr>
                    <th class="tuition-fee">주소</th>
                    <td colspan="3">
                      <input type="text" name="centerID" value="322-88-00028">
                    </td>
                </tbody>
              </table>
              <!-- 기본 정보 -->
              <div class="common-title">
                <h2>선생님 관리</h2>
              </div>
              <div class="manager-contents">
                <div class="manager-top">
                  <div class="table-frame manage-tbl-frame">
                    <table class="basic-table yh">
                      <colgroup>
                        <col width="10%">
                        <col width="15%">
                        <col width="15%">
                        <col width="20%">
                        <col width="20%">
                      </colgroup>
                      <thead>
                        <tr>
                          <th>No</th>
                          <th><img src="image/sort_checked.svg" alt="" class="svg-sort">이름</th>
                          <th>ID</th>
                          <th><img src="image/sort.svg" alt="" class="svg-sort">생성일자</th>
                          <th>사용여부</th>
                        </tr>
                      </thead>
                      <tbody id="" class="stripe">
                        <tr>
                          <td>1</td>
                          <td class="manage-icon"><img src="image/icon-op.png" alt="">김호호</td>
                          <td>kimhoho1</td>
                          <td>2022-08-18</td>
                          <td>
                            <div class="pay-box pay-late">미사용</div>
                          </td>
                        </tr>
                        <tr>
                          <td>2</td>
                          <td class="manage-icon"><img src="image/icon-ad.png" alt="">김호호</td>
                          <td>kimhoho1</td>
                          <td>2022-08-18</td>
                          <td>
                            <div class="pay-box pay-done">사용</div>
                          </td>
                        </tr>
                        <tr>
                          <td>3</td>
                          <td class="manage-icon"><img src="image/icon-ad.png" alt="">김호호</td>
                          <td>kimhoho3</td>
                          <td>2022-08-18</td>
                          <td>
                            <div class="pay-box pay-done">사용</div>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>

</html>
