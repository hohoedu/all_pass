<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Custom Css / Js -->
  <link rel="stylesheet" th:href="@{/css/admin-style.css}">
  <link rel="stylesheet" th:href="@{/css/media.css}">
  <link rel="stylesheet" th:href="@{/css/admin/center_status.css}">
  <script th:src="@{/js/custom.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:src="@{/js/admin/center/center_status.js}" defer></script>
  <title>센터별 현황</title>
</head>

<body>
  <div class="main-container">
    <div class="main-frame">
      <aside th:replace="~{admin/admin-sidebar :: adminSidebar}"></aside>
      <main class="main-info">
        <div class="student-frame">
          <!-- section:top -->
          <section>
            <div class="class-desc">
              <div class="class-header">
                <div class="common-title">
                  <h2>센터별 현황</h2>
                </div>
                <div class="class-btns">
                  <div class="common-btn record-save" id="excelDownloadBtn">엑셀 다운로드</div>
                </div>
              </div>
              <div class="month-header2 month-today" style="padding: 10px 0;">
                <div class="month-title2">
                  <span id="monthDisplay" class="current-month" th:text="${year + '. ' + month}"></span>
                  <div class="calendar-wrapper">
                    <input type="month" id="monthPicker" class="hidden-date" th:value="${year + '-' + month}" />
                    <button type="button" class="icon-btn calendar-open calendar-btn" data-picker="monthPicker">
                      <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- section:summary -->
          <section class="cs-summary">
            <div class="cs-card">
              <span class="cs-card-label">운영 센터</span>
              <strong class="cs-card-value" id="sumCenterCount">0<small>곳</small></strong>
            </div>
            <div class="cs-card">
              <span class="cs-card-label">전체 재원생</span>
              <strong class="cs-card-value" id="sumStudentCount">0<small>명</small></strong>
              <span class="cs-card-sub" id="sumStudentSub">신규 0 · 퇴원 0</span>
            </div>
            <div class="cs-card cs-card-warn">
              <span class="cs-card-label">교재비 미납 학생</span>
              <strong class="cs-card-value" id="sumUnpaidCount">0<small>명</small></strong>
              <span class="cs-card-sub" id="sumUnpaidRate">미납률 0%</span>
            </div>
            <div class="cs-card cs-card-warn">
              <span class="cs-card-label">교재비 미납 금액</span>
              <strong class="cs-card-value" id="sumUnpaidAmount">0<small>원</small></strong>
            </div>
          </section>

          <!-- section:bottom -->
          <div class="second-frame cs-2col">
            <!-- 센터별 인원수 -->
            <section class="cs-center-col">
              <div class="cs-panel-head">
                <h4>센터별 인원수</h4>
                <span class="cs-hint">센터를 클릭하면 미납 학생을 볼 수 있어요</span>
              </div>
              <div class="cs-table-scroll">
                <table class="cs-table cs-center-table">
                  <colgroup>
                    <col width="26%">
                    <col width="13%">
                    <col width="12%">
                    <col width="12%">
                    <col width="15%">
                    <col width="22%">
                  </colgroup>
                  <thead>
                    <tr>
                      <th class="cs-sortable" data-sort="centerName">센터명</th>
                      <th class="cs-sortable" data-sort="studentCount">재원</th>
                      <th class="cs-sortable" data-sort="newCount">신규</th>
                      <th class="cs-sortable" data-sort="leaveCount">퇴원</th>
                      <th class="cs-sortable" data-sort="unpaidCount">미납</th>
                      <th class="cs-sortable" data-sort="unpaidRate">미납률</th>
                    </tr>
                  </thead>
                  <tbody id="centerTableBody"></tbody>
                  <tfoot>
                    <tr>
                      <td>합계</td>
                      <td id="footStudent">0</td>
                      <td id="footNew">0</td>
                      <td id="footLeave">0</td>
                      <td id="footUnpaid">0</td>
                      <td id="footRate">0%</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </section>

            <!-- 교재비 미납 학생 현황 -->
            <section class="cs-unpaid-col">
              <div class="cs-panel-head">
                <h4><span id="selectedCenterName">전체 센터</span> 교재비 미납 학생</h4>
                <div class="cs-filter">
                  <input type="text" id="unpaidSearch" placeholder="학생명 / 교재명 검색">
                  <div class="basic-select">
                    <select id="unpaidCenterSelect">
                      <option value="">전체 센터</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="cs-table-scroll">
                <table class="cs-table cs-unpaid-table">
                  <colgroup>
                    <col width="5%">
                    <col width="14%">
                    <col width="11%">
                    <col width="8%">
                    <col width="12%">
                    <col width="18%">
                    <col width="12%">
                    <col width="10%">
                    <col width="10%">
                  </colgroup>
                  <thead>
                    <tr>
                      <th>No</th>
                      <th>센터</th>
                      <th>학생명</th>
                      <th>학년</th>
                      <th>담당</th>
                      <th>교재</th>
                      <th>미납 금액</th>
                      <th>청구월</th>
                      <th>상태</th>
                    </tr>
                  </thead>
                  <tbody id="unpaidTableBody"></tbody>
                </table>
              </div>
              <div class="cs-unpaid-foot">
                <span>총 <strong id="unpaidListCount">0</strong>명</span>
                <span>미납 합계 <strong id="unpaidListAmount">0</strong>원</span>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>

</html>
