<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Custom Css / Js -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/media.css">
  <script src="js/custom.js"></script>
  <!-- Html menu Load -->
  <script src="js/loadHTML.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <title>공지/자료실</title>
</head>

<body>
  <div class="main-container">
    <!-- header -->
    <div class="main-frame">
      <!-- left nav bar -->
      <aside id="sidebar-load"></aside>
      <main class="main-info">
        <div class="student-frame time-regist-frame">
          <!-- section:top -->
          <section>
            <div class="class-desc">
              <div class="class-header">
                <div class="common-title">
                  <h2>공지/자료실</h2>
                </div>
              </div>
            </div>
          </section>
          <!-- section:bottom -->
          <div class="second-frame" style="padding: 0 15px;">
            <section class="">
              <div class="">
                <div class="table-frame move-t-frame">
                  <table class="basic-table yh">
                    <colgroup>
                      <col width="5%">
                      <col width="10%">
                      <col width="70%">
                      <col width="15%">
                    </colgroup>
                    <thead>
                      <tr>
                        <th>No</th>
                        <th>유형</th>
                        <th>제목</th>
                        <th>등록일</th>
                      </tr>
                    </thead>
                    <tbody id="notice-tbody" class="stripe">
                      <tr class="">
                        <td>1</td>
                        <td>
                          <div class="pay-box block-notice">공지</div>
                        </td>
                        <td>공지사항 안내 제목이 들어갈 위치입니다.</td>
                        <td>2025-11-10</td>
                      </tr>
                      <tr>
                        <td>2</td>
                        <td>
                          <div class="pay-box block-notice">공지</div>
                        </td>
                        <td>공지사항 안내 제목이 들어갈 위치입니다.</td>
                        <td>2025-11-10</td>
                      </tr>
                      <tr>
                        <td>3</td>
                        <td>
                          <div class="pay-box block-source">자료</div>
                        </td>
                        <td>공지사항 안내 제목이 들어갈 위치입니다.</td>
                        <td>2025-11-10</td>
                      </tr>
                      <tr>
                        <td>4</td>
                        <td>
                          <div class="pay-box block-source">자료</div>
                        </td>
                        <td>공지사항 안내 제목이 들어갈 위치입니다.</td>
                        <td>2025-11-10</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          </div>
        </div>
        <div class="modal personal-modal modal2">
          <div class="personal-inner">
            <div class="m-t-line" style="margin: 10px 20px 30px 0">
              <div class="title">게시글 작성</div>
              <a href="#" class="btn-close"></a>
            </div>
            <div class="second-frame" style="padding: 0 15px; margin-bottom:10px;">
              <section class="notice-code-left">
                <div class="student-content">
                  <h4>학원 선택</h4>
                  <div class="mt">
                    <div class="table-frame stu-chocie-frame">
                      <table class="basic-table stu-chocie-table stripe">
                        <thead>
                          <tr>
                            <th><img src="image/sort_checked.svg" alt="" class="svg-sort">지점명
                            </th>
                            <th><img src="image/sort.svg" alt="" class="svg-sort">상태</th>
                          </tr>
                        </thead>
                        <tbody id="" class="stripe">
                        </tbody>
                        <colgroup>
                          <col width="60%">
                          <col width="40%">
                        </colgroup>
                        <tbody>
                          <tr>
                            <td class="stu-badge"><span class="names">부산 남천점</span></td>
                            <td>사용중</td>
                          </tr>
                          <tr>
                            <td class="stu-badge"><span class="names">대구 월성점</span></td>
                            <td>사용중</td>
                          </tr>
                          <tr>
                            <td class="stu-badge"><span class="names">울산 유곡점</span></td>
                            <td>사용중</td>
                          </tr>
                          <tr>
                            <td class="stu-badge"><span class="names">서울 대치점</span></td>
                            <td>미사용</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </section>
              <section class="notice-code-right">
                <table class="base-info-t">
                  <colgroup>
                    <col width="15%">
                    <col width="85%">
                  </colgroup>
                  <tbody>
                    <tr>
                      <th>유형</th>
                      <td>
                        <div class="radio-group">
                          <input type="radio" name="period" id="notice-notice" value="1y" checked="">
                          <label for="notice-notice">공지</label>
                          <input type="radio" name="period" id="notice-source" value="6m">
                          <label for="period-6month">자료공유</label>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <th class="tuition-fee">제목</th>
                      <td>
                        <input type="text" name="title" placeholder="제목을 입력해 주세요.">
                      </td>
                    </tr>
                    <tr>
                      <th class="tuition-fee">내용</th>
                      <td>
                        <!-- HTML 에디터 삽입 -->
                      </td>
                    </tr>
                    <tr>
                      <th class="tuition-fee">첨부파일</th>
                      <td>
                        <label class="file-upload">
                          파일 선택
                          <input type="file" name="upload_file" hidden>
                        </label>
                        <span class="file-name">2025년 11월 자료.zip</span>
                        <span class="file-remove">X</span>

                      </td>
                    </tr>
                  </tbody>
                </table>
              </section>
            </div>
            <div class="save-btn-frame">
              <button class="save-btn">저장</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>

</html>
