<div class="modal-backdrop" id="order-add-modal" th:fragment="orderAddModal">
    <div class="modal2">
        <button type="button" class="modal-close" id="add-modal-close-btn">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h2 class="modal-title" id="add-modal-title">현재 명세서에 수기로 추가</h2>

        <div class="modal-stack">

            <!-- 정기 주문 명세서용 -->
            <section class="modal-panel" id="add-regular-section">
                <div class="modal-panel-title item-title">
                    <span>품목 추가</span>
                    <button type="button" class="print-btn" id="add-regular-add-item-btn">+ 품목 추가</button>
                </div>
                <div class="modal-item-table-wrap">
                    <table class="invoice-item-table">
                        <colgroup>
                            <col style="width: 16%">
                            <col style="width: 16%">
                            <col style="width: 10%">
                            <col style="width: 8%">
                            <col style="width: 12%">
                            <col style="width: 16%">
                            <col style="width: 16%">
                            <col style="width: 6%">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>품명</th>
                            <th>규격</th>
                            <th>단가</th>
                            <th>수량</th>
                            <th>가격</th>
                            <th>비고(선생님)</th>
                            <th>사유</th>
                            <th>삭제</th>
                        </tr>
                        </thead>
                        <tbody id="add-regular-item-table-body"></tbody>
                    </table>
                </div>
            </section>

            <!-- 수기 명세서용 -->
            <section class="modal-panel" id="add-manual-section">
                <div class="modal-panel-title item-title">
                    <span>품목 추가</span>
                    <button type="button" class="print-btn" id="add-modal-add-item-btn">+ 품목 추가</button>
                </div>
                <div class="modal-item-table-wrap">
                    <table class="invoice-item-table">
                        <colgroup>
                            <col style="width: 12%">
                            <col style="width: 12%">
                            <col style="width: 5%">
                            <col style="width: 5%">
                            <col style="width: 10%">
                            <col style="width: 10%">
                            <col style="width: 12%">
                            <col style="width: 12%">
                            <col style="width: 5%">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>주문일시</th>
                            <th>품명</th>
                            <th>규격</th>
                            <th>수량</th>
                            <th>단가</th>
                            <th>금액</th>
                            <th>비고</th>
                            <th>승인일자</th>
                            <th>삭제</th>
                        </tr>
                        </thead>
                        <tbody id="add-modal-item-table-body">
                        <tr class="modal-item-row">
                            <td><input type="date" class="item-order-date"></td>
                            <td><input type="text" class="item-name"></td>
                            <td><input type="text" class="item-spec"></td>
                            <td><input type="text" class="item-qty"></td>
                            <td><input type="text" class="item-price"></td>
                            <td><input type="text" class="item-amount" readonly></td>
                            <td><input type="text" class="item-note"></td>
                            <td><input type="date" class="item-approve-date"></td>
                            <td><button type="button" class="item-delete-btn" aria-label="행 삭제"><i class="fa-regular fa-trash-can"></i></button></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 총 합계 -->
            <div class="summary-box">
                <div class="modal-total">
                    <span>총 합계 금액</span>
                    <strong id="add-modal-total-amount">0원</strong>
                </div>
            </div>

        </div>

        <div class="modal-footer">
            <button type="button" class="primary-btn" id="add-modal-save-btn">저장</button>
        </div>
    </div>
</div>
