<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/admin/ebook/person.js}"></script>
    <!-- Html menu Load -->
    <script th:src="@{/js/sidebar.js}"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <title>연간 이북 세팅</title>
</head>

<body>
<div class="main-container">
    <!-- header -->
    <div class="main-frame">
        <!-- left nav bar -->
        <aside th:replace="~{admin/admin-sidebar :: adminSidebar}"></aside>
        <main class="main-info">
            <div class="student-frame time-regist-frame">
                <!-- section:top -->
                <section>
                    <div class="class-desc">
                        <div class="class-header">
                            <div class="common-title">
                                <h2>연간 e-book 세팅</h2>
                            </div>
                            <div class="class-btns">
                                <div class="common-btn record-save">저장</div>
                            </div>
                        </div>
                    </div>
                </section>
                <!-- section:bottom -->
                <div class="month-header2 month-today" style="padding: 10px 0;">
                    <div class="month-title2 month-today">
                        <span class="current-month"></span>
                        <div style="position: relative;">
                            <div class="day-display">
                                <input type="month" class="hidden-date hidden-picker"/>
                                <button type="button" class="icon-btn calendar-open">
                                    <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="second-frame" style="padding: 0 15px;">
                    <section class="ebook-code-left">

                        <div class="student-content">
                            <h4>학원 선택</h4>
                            <div class="mt">
                                <div class="table-frame stu-chocie-frame">
                                    <table class="basic-table stu-chocie-table stripe">
                                        <colgroup>
                                            <col width="10%">
                                            <col width="50%">
                                            <col width="40%">
                                        </colgroup>
                                        <thead>
                                        <tr>
                                            <th>NO</th>
                                            <th><img th:src="@{/image/sort_checked.svg}" alt="" class="svg-sort">지점명
                                            </th>
                                            <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">상태</th>
                                        </tr>
                                        </thead>
                                        <tbody id="" class="stripe">

                                        <tr th:each="c, iterStat : ${center}"
                                            th:attr="data-center-code=${c.centerCode}">
                                            <td th:text="${iterStat.index + 1}"></td>
                                            <td class="stu-badge">
                                                <span class="names" th:text="${c.region.getRegionName() + ' ' + c.centerName}"></span>
                                            </td>
                                            <td>
                                                <span th:text="${c.status == 'open' ? '사용중' : '미사용'}"></span>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </section>
                    <section class="ebook-code-right ebook-code-right2">
                        <div class="small-title">지점을 선택해주세요.</div>
                        <div class="ebook-person-table">
                            <div class="table-frame move-t-frame">
                                <table class="base-info-t none-border">
                                    <colgroup>
                                        <col width="16%">
                                        <col width="14%">
                                        <col width="14%">
                                        <col width="14%">
                                        <col width="14%">
                                        <col width="14%">
                                        <col width="14%">
                                    </colgroup>

                                    <thead>
                                    <tr>
                                        <th rowspan="2">월</th>
                                        <th colspan="2">키움(5세)</th>
                                        <th colspan="2">만남(6세)</th>
                                        <th colspan="2">자람(7세)</th>
                                    </tr>
                                    <tr>
                                        <th>메인</th>
                                        <th>서브</th>
                                        <th>메인</th>
                                        <th>서브</th>
                                        <th>메인</th>
                                        <th>서브</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr>
                                        <td colspan="7" style="text-align:center; padding:50px; color:#777; background-color: #fff;">
                                            지점을 선택하면 연간 이북 세팅 정보가 표시됩니다.
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>
<div id="unit-options-container" style="display:none;">
    <select id="unit-options-source">
        <option value=""></option>
        <th:block th:each="u : ${unitCodes}">
            <option th:value="${u.unitKey}"
                    th:text="${u.unitKey + ' ' + u.unitName}">
            </option>
        </th:block>
    </select>
</div>
</body>
</html>
