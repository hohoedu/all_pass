<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>시간표 인쇄</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 8mm;
        }

        body {
            height: 210mm;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .a4-print {
            width: 100%;
            height: 191mm;
            /* A4 가로 높이 - 여백 */
            display: flex;
            flex-direction: column;
        }

        .timetable-lookup-table {
            flex: 1;
            height: 100%;
        }

        .timetable-lookup-table tbody {
            height: 100%;
        }

        .timetable-lookup-table tbody tr {
            height: calc(100% / 6);
        }

        /* 6교시 균등 분배 */
        .timetable-lookup-table td {
            vertical-align: top;
            overflow: hidden;
            /* 넘치는 내용 자름 */
            padding: 2px;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .inner-grid div.wide {
            grid-column: span 2;
        }

        .inner-grid div {
            font-size: 9px;
            padding: 1px 2px;
            line-height: 1.3;
            border-bottom: 1px dashed #ccc;
            /* 행 사이 구분선 */
        }

        /* 마지막 행(4개)은 하단 대시 제거 */
        .inner-grid div:nth-last-child(-n+4) {
            border-bottom: none;
        }

        .inner-grid div:nth-child(4n+2) {
            border-right: 1px dashed #ccc;
            padding-right: 3px;
        }

        .timetable-lookup-table {
            width: 100%;
            border-collapse: collapse;
            flex: 1;
            table-layout: fixed;
        }

        .timetable-lookup-table th {
            border: 1px solid #ccc;
            padding: 4px;
            text-align: center;
            font-size: 12px;
            background: #f5f5f5;
        }

        .timetable-lookup-table td {
            border: 1px solid #ccc;
            padding: 2px;
            vertical-align: top;
            /* height: 125px; */
        }

        .timetable-lookup-table td:first-child {
            text-align: center;
            vertical-align: middle;
            font-size: 13px;
            font-weight: bold;
            width: 25px;
        }

        .timetable-lookup-box {
            border-radius: 10px;
            height: 100%;
        }

        .timetable-lookup-box.pink {
            background: #ffd6de;
        }

        .timetable-lookup-box.blue {
            background: #c8eef5;
        }

        .print-timetable-header {
            text-align: center;
            font-size: 9px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 2px;
            margin-bottom: 2px;
        }

        .inner-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 1px;
        }

        .inner-grid div {
            font-size: 9px;
            padding: 1px 2px;
            border-bottom: 1px dashed #ccc;
            line-height: 1.3;
        }
    </style>
</head>

<body>
    <div class="a4-print">
        <div class="month-header">
            <span th:text="${yy + '년 ' + mm + '월'}"></span>
            <span>담당 선생님 : <span th:text="${selectedUser.userName}"></span></span>
        </div>
        <table class="timetable-lookup-table">
            <thead>
                <tr>
                    <th style="padding:0; font-size:14px;">교시</th>
                    <th th:each="day : ${days}" th:text="${day.label}" style="font-size:14px;"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="periodNo : ${#numbers.sequence(1,6)}">
                    <td th:text="${periodNo}"></td>
                    <td th:each="day : ${days}" th:with="dayMap=${tableMap[day.id]}"
                        style="vertical-align:top; padding:2px;">
                        <div th:if="${dayMap != null and dayMap[periodNo.toString()] != null}"
                            th:with="tt=${dayMap[periodNo.toString()]}">
                            <div th:class="timetable-lookup-box"
                                th:classappend="${tt.classType eq '1'} ? ' pink' : ' blue'">
                                <div class="print-timetable-header"
                                    th:utext="${tt.startTime} + ' ~ ' + ${tt.endTime} + '<br><strong>' + ${tt.className} + '</strong>'">
                                </div>
                                <div class="inner-grid">
                                    <div th:each="stu : ${tt.students}" th:text="${stu.studentName}"
                                        th:classappend="${stu.studentName != null and #strings.length(stu.studentName) >= 4} ? ' wide'"
                                        style="font-size:9px; padding:1px; line-height:1.3;">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
