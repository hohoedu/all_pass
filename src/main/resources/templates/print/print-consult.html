<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>상담문의 기록</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 10mm;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: #fff;
            font-family: "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: #111;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .sheet {
            width: 297mm;
            min-height: 200mm;
            box-sizing: border-box;
            padding: 0;
            margin: 0 auto;
        }

        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: end;
            column-gap: 6mm;
            padding: 2mm 0 4mm;
            margin-bottom: 3mm;
        }

        .header .left,
        .header .right {
            font-size: 3.6mm;
            font-weight: 700;
        }

        .header .title {
            font-size: 6.2mm;
            font-weight: 900;
            letter-spacing: -0.2mm;
            text-align: center;
            line-height: 1.1;
        }

        .header .right {
            text-align: right;
        }

        .muted {
            color: rgba(0, 0, 0, .75);
            font-weight: 700;
        }

        /* ===== Table ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 3.2mm;
            border-top: 0.35mm solid rgba(70, 70, 110, .75);
            border-bottom: 0.35mm solid rgba(70, 70, 110, .75);
        }

        thead {
            display: table-header-group;
        }

        th,
        td {
            border-right: 0.25mm solid rgba(0, 0, 0, .12);
            border-bottom: 0.25mm solid rgba(0, 0, 0, .12);
            padding: 2.2mm 1.8mm;
            vertical-align: middle;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        th:last-child,
        td:last-child {
            border-right: none;
        }

        thead th {
            font-weight: 900;
            text-align: center;
            padding: 2.6mm 1.8mm;
        }

        tbody tr:nth-child(odd) {
            background: rgba(0, 0, 0, .02);
        }

        tr {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        col.no {
            width: 10mm;
        }

        col.date {
            width: 20mm;
        }

        col.name {
            width: 16mm;
        }

        col.school {
            width: 26mm;
        }

        col.grade {
            width: 14mm;
        }

        col.phone {
            width: 24mm;
        }

        col.subject {
            width: 24mm;
        }

        col.teacher {
            width: 18mm;
        }

        col.memo {
            width: 50mm;
        }

        col.channel {
            width: 18mm;
        }

        col.status {
            width: 24mm;
        }

        col.sent {
            width: 33mm;
        }

        td.center {
            text-align: center;
        }

        td.memo {
            line-height: 1.25;
            white-space: pre-line;
        }

        .badge {
            display: inline-block;
            min-width: 11mm;
            text-align: center;
            padding: 2.2mm 3mm;
            border-radius: 1.2mm;
            font-weight: 900;
            color: #fff;
            font-size: 3.1mm;
        }

        .b-yellow {
            background: #f2b400;
        }

        .b-orange {
            background: #ff5a1f;
        }

        .b-green {
            background: #14a000;
        }

        .b-gray {
            background: #b7b7b7;
            color: #111;
        }
    </style>
</head>

<body>
<div class="sheet">
    <div class="header">
        <div class="left">
            <span class="muted">기간 :</span>
            <span th:text="${startDate + ' ~ ' + endDate}"></span>
        </div>
        <div class="title">상담문의 기록</div>
        <div class="right" th:text="${userName + ' 선생님'}"></div>
    </div>

    <table>
        <colgroup>
            <col class="no"/>
            <col class="date"/>
            <col class="name"/>
            <col class="school"/>
            <col class="grade"/>
            <col class="phone"/>
            <col class="subject"/>
            <col class="teacher"/>
            <col class="memo"/>
            <col class="channel"/>
            <col class="status"/>
            <col class="sent"/>
        </colgroup>
        <thead>
        <tr>
            <th>No</th>
            <th>일자</th>
            <th>이름</th>
            <th>학교</th>
            <th>학년</th>
            <th>연락처</th>
            <th>문의 과목</th>
            <th>상담 선생님</th>
            <th>메모사항</th>
            <th>유입경로</th>
            <th>진행상황</th>
            <th>발송/입회일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c, stat : ${consults}">
            <td class="center" th:text="${stat.count}"></td>
            <td class="center" th:text="${c.consultDate}"></td>
            <td class="center" th:text="${c.studentName}"></td>
            <td class="center" th:text="${c.school}"></td>
            <td class="center" th:text="${c.gradeName}"></td>
            <td class="center" th:text="${c.phone}"></td>
            <td class="center" th:text="${c.subjectNames}"></td>
            <td class="center" th:text="${c.userName}"></td>
            <td class="memo" th:text="${c.content}"></td>
            <td class="center" th:text="${c.inflowRouteName}"></td>
            <td class="center">
        <span th:classappend="
          ${c.progressName == '문의'} ? 'badge b-yellow' :
          (${c.progressName == '대기'} ? 'badge b-orange' :
          (${c.progressName == '입회'} ? 'badge b-green' :
          'badge b-gray'))"
              th:text="${c.progressName}">
        </span>
            </td>
            <td class="center" th:text="${c.sendAt != null ? c.sendAt : '-'}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
