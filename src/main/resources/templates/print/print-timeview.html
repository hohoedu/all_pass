<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <title>시간표 조회</title>
</head>
<body style="height: 297mm">
<div class="a4-print">
    <div class="month-header month-today">
        <div class="month-title">
            <div class="empty-area" style="width: 200px"></div>
            <span class="current-month" id="currentMonth"></span>
            <div style="position: relative;">
                <div class="calendar-wrapper">
                    <span class="current-month"
                          th:text="${yy + '년 ' + mm + '월'}"></span>
                </div>
            </div>
        </div>
        <span>
        담당 선생님 : <span th:text="${selectedUser.userName}"></span>
        </span>

        <!--        <div class="basic-select">-->
        <!--            <select name="teacher" id="teacher-select" style="width: 200px;">-->
        <!--                <th:block th:each="u : ${users}">-->
        <!--                    <option th:value="${u.userCode}" th:text="${u.userName + ' 선생님'}"-->
        <!--                            th:selected="${u.userCode == selectedUserCode}">-->
        <!--                    </option>-->
        <!--                </th:block>-->
        <!--            </select>-->
        <!--        </div>-->
    </div>
    <!-- table -->
    <table class="timetable-lookup-table">
        <thead>
        <tr>
            <th style="padding: 0;">교시</th>
            <th th:each="day : ${days}" th:text="${day.label}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="periodNo : ${#numbers.sequence(1,6)}">
            <td th:text="${periodNo}">1</td>
            <td th:each="day : ${days}" th:with="dayMap=${tableMap[day.id]}" style="height: 150px;">
                <div th:if="${dayMap != null and dayMap[periodNo.toString()] != null}"
                     th:with="tt=${dayMap[periodNo.toString()]}">
                    <div th:class="timetable-lookup-box" th:classappend="${tt.classType eq '1'} ? ' pink' : ' blue'">
                        <div class="header" th:utext="${tt.startTime} + ' ~ ' + ${tt.endTime} + '<br>
                            <strong>' + ${tt.className} + ' ' + ${tt.unitName} + '</strong>'">
                        </div>
                        <div class="inner-grid">
                            <div th:each="stu : ${tt.students}" th:text="${stu.studentName}"
                                 th:attr="data-name=${stu.studentName}">
                            </div>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>

</html>
