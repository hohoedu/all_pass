<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/xpressengine/XEIcon/xeicon.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/pay/pay_reconcile.js}"></script>
    <title>매출자료 대조</title>
    <style>
        .reconcile-upload { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            padding: 20px; background: #f7f8fa; border-radius: 10px; margin-bottom: 20px; }
        .reconcile-upload label { font-weight: 600; }
        .reconcile-summary { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
        .summary-card { flex: 1; min-width: 130px; padding: 16px; border-radius: 10px;
            background: #fff; border: 1px solid #e6e8eb; text-align: center; }
        .summary-card .num { font-size: 26px; font-weight: 700; margin-top: 6px; }
        .summary-card.red { border-color: #f3c2c2; background: #fff5f5; }
        .summary-card.yellow { border-color: #f0e0a8; background: #fffdf2; }
        .summary-card.green { border-color: #bfe3c6; background: #f4fbf5; }
        .reconcile-tables { display: flex; gap: 20px; flex-wrap: wrap; }
        .reconcile-block { flex: 1; min-width: 380px; }
        .reconcile-block h3 { margin: 0 0 8px; font-size: 15px; }
        .reconcile-block .tag { font-size: 12px; color: #888; font-weight: 400; }
        table.reconcile { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.reconcile th, table.reconcile td { border: 1px solid #e6e8eb; padding: 6px 8px; text-align: center; }
        table.reconcile th { background: #f2f4f6; }
        table.reconcile tbody { display: block; max-height: 460px; overflow-y: auto; }
        table.reconcile thead, table.reconcile tbody tr { display: table; width: 100%; table-layout: fixed; }
        .empty-row td { color: #aaa; padding: 24px; }
        #reconcile-result { display: none; margin-top: 8px; }
        .date-range { color: #666; font-size: 13px; margin-bottom: 16px; }
        .loading { display: none; color: #4a7dff; font-weight: 600; }
    </style>
</head>

<body th:data-center-code="${user.centerCode}">
<div class="main-container">
    <div class="main-frame">

        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>

        <main class="main-info">
            <div class="student-frame">
                <section>

                    <div class="common-title">
                        <h2>매출자료 대조 (승인번호)</h2>
                    </div>

                    <div class="reconcile-upload">
                        <label for="source">매출자료</label>
                        <select id="source">
                            <option value="yeoshin">여신금융협회</option>
                            <option value="hometax">홈택스</option>
                        </select>
                        <input type="file" id="reconcile-file" accept=".xls,.xlsx"/>
                        <button class="common-btn" id="btn-reconcile">대조 실행</button>
                        <span class="loading" id="reconcile-loading">대조 중...</span>
                    </div>

                    <div id="reconcile-result">
                        <div class="date-range" id="reconcile-daterange"></div>

                        <div class="reconcile-summary">
                            <div class="summary-card">엑셀 승인건<div class="num" id="sum-file">0</div></div>
                            <div class="summary-card">DB 대조건<div class="num" id="sum-db">0</div></div>
                            <div class="summary-card green">일치<div class="num" id="sum-matched">0</div></div>
                            <div class="summary-card red">DB 없음<div class="num" id="sum-missing-db">0</div></div>
                            <div class="summary-card yellow">파일 없음<div class="num" id="sum-missing-file">0</div></div>
                        </div>

                        <div class="common-title" style="margin-bottom:12px;">
                            <h2 style="font-size:16px;">불일치 내역</h2>
                            <button class="common-btn pay-desc" id="btn-reconcile-download">엑셀 다운로드</button>
                        </div>

                        <div class="reconcile-tables">
                            <div class="reconcile-block">
                                <h3>🔴 매출 확인 필요 <span class="tag">(엑셀엔 있으나 결제내역에 없음)</span></h3>
                                <table class="reconcile">
                                    <thead>
                                    <tr><th>거래일자</th><th>카드사</th><th>승인번호</th><th>승인금액</th></tr>
                                    </thead>
                                    <tbody id="tbl-missing-db"></tbody>
                                </table>
                            </div>
                            <div class="reconcile-block">
                                <h3>🟡 반영지연·취소 의심 <span class="tag">(결제내역엔 있으나 엑셀에 없음)</span></h3>
                                <table class="reconcile">
                                    <thead>
                                    <tr><th>승인일시</th><th>카드/은행</th><th>승인번호</th><th>상태</th></tr>
                                    </thead>
                                    <tbody id="tbl-missing-file"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </section>
            </div>
        </main>
    </div>
</div>
</body>
</html>
