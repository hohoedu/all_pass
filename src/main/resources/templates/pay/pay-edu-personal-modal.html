<div class="modal personal-modal" th:fragment="eduPersonalModal">
    <div class="pay-list">
        <div class="pay-m-frame">
            <div class="m-t-line" style="margin-bottom: 10px;">
                <div class="title">
                    학생의 수강료 상세 내역
                </div>
                <a href="#" class="btn-close"></a>
            </div>
            <div class="info-tab-inner">
                <div class="info-tab-btn">
                    <a href="#tab1" data-tab="tab1" class="active">수강료 상세정보</a>
                    <a href="#tab2" data-tab="tab2">상세 청구 내역</a>
                </div>
                <div class="info-tab-content ">
                    <!-- ##### tab1 ##### -->
                    <div id="tab1" class="tab active">
                        <div class="modal-scroll">
                            <div class="pay-details">
                                <h4><span>학생</span>의 수강료 상세정보</h4>

                                <!-- ✅ 전화번호 수정 테이블 -->
                                <div class="table-frame">
                                    <table class="member-status-table pay-edu-table bt">
                                        <colgroup>
                                            <col width="20%">
                                            <col width="80%">
                                        </colgroup>
                                        <tbody>
                                        <tr>
                                            <td>수강료 청구용 전화번호</td>
                                            <td>
                                                <div style="display: flex; gap: 8px; align-items: center;">
                                                    <input
                                                            type="text"
                                                            class="basic-input phone-input"
                                                            id="modal-phone-input"
                                                            placeholder="전화번호를 입력하세요"
                                                            maxlength="13"
                                                            style="flex: 1;"
                                                    >
                                                    <div class="save-btn-frame" style="flex: 1; display: flex; justify-content: center;">
                                                        <button class="save-btn" id="modal-phone-save-btn">변경</button>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <!-- ✅ 수강료 테이블 -->
                                <div class="table-frame pay-edu-frame" style="margin-top: 16px;">
                                    <table class="member-status-table pay-edu-table bt">
                                        <colgroup>
                                            <col width="20%">
                                            <col width="80%">
                                        </colgroup>
                                        <tbody>
                                        <tr>
                                            <td>한자 교육비</td>
                                            <td>
                                                <input type="text" class="basic-input edu-input" data-type="hanEdu" data-raw-value="0">
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>한자 교재비</td>
                                            <td>
                                                <input type="text" class="basic-input edu-input material-input" data-type="hanMaterial" data-raw-value="0">
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>독서 교육비</td>
                                            <td>
                                                <input type="text" class="basic-input edu-input" data-type="bookEdu" data-raw-value="0">
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>독서 교재비</td>
                                            <td>
                                                <input type="text" class="basic-input edu-input material-input" data-type="bookMaterial" data-raw-value="0">
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>합계</td>
                                            <td class="edu-sum"></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div class="save-btn-frame" style="margin-top: 30px;">
                                    <button class="save-btn">저장</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- ##### tab2 ##### -->
                    <div id="tab2" class="tab">
                        <div class="claim-m-inner">
                            <div class="">
                                <div class="claim-list">
                                    <h3 class="claim-sub">상세 청구 내역</h3>
                                </div>
                                <div class="modal-scroll bt">
                                    <div class="table-frame claim-frame">
                                        <table class="basic-table yh">
                                            <colgroup>
                                                <col width="7%">
                                                <col width="3%">
                                                <col width="10%">
                                                <col width="10%">
                                                <col width="10%">
                                                <col width="10%">
                                                <col width="10%">
                                                <col width="10%">
                                                <col width="15%">
                                            </colgroup>
                                            <thead>
                                            <tr>
                                                <th class="checkbox-group">
                                                    <input type="checkbox">
                                                </th>
                                                <th>No</th>
                                                <th>수강년월</th>
                                                <th>이름</th>
                                                <th>수강과목</th>
                                                <th>담임</th>
                                                <th>결제일자</th>
                                                <th>결제금액</th>
                                                <th>상태</th>
                                            </tr>
                                            </thead>
                                            <tbody id="personal-tbody" class="stripe">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
