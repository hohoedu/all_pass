<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/pay/pay_list.js}"></script>
    <!-- Html menu Load -->
    <script th:src="@{/js/sidebar.js}"></script>
    <title>월별 결제 관리</title>
</head>
<body>
<div class="main-container">
    <div class="main-frame">
        <!-- left nav bar -->
        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
        <main class="main-info">
            <div class="student-frame">
                <!-- section:left -->
                <section>
                    <div class="common-title">
                        <h2>월별 결제 관리</h2>
                        <div class="header-btns">
                            <div class="issue-payment common-btn" id="btn-add-cashbill">현금영수증</div>
                            <div class="add-payment common-btn" id="btn-add-payment">+ 납부내역 추가</div>
                        </div>
                    </div>
                    <div class="month-header">
                        <div class="month-title month-today">
                            <span class="current-month"></span>
                            <div style="position: relative;">
                                <input type="month" class="hidden-date" id="billing-month">
                                <button type="button" class="icon-btn calendar-open" data-target="billing-month">
                                    <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                                </button>
                            </div>
                        </div>
                        <div class="info-arrange">
                            <div class="stu-left">
                                <div class="basic-select sl1">
                                    <select name="student" id="student-filter">
                                        <option value="student1">전체</option>
                                    </select>
                                </div>
                            </div>
                            <div class="stu-right">
                                <div class="sl3">
                                    <div class="basic-select" style="flex: 1;">
                                        <select name="stuName" id="stu-name">
                                            <option value="all">이름</option>
                                        </select>
                                    </div>
                                    <div class="search-box" style="flex: 2;">
                                        <input type="text" id="search-name" name="searchName">
                                    </div>
                                </div>
                                <div class="explore common-btn sl4">검색</div>
                            </div>
                        </div>
                    </div>
                    <div class="mt">
                        <div class="table-frame plt-adjust">
                            <!-- 고정 헤더 테이블 -->
                            <table class="basic-table pay-list-t yh table-head">
                                <colgroup class="pay-colgroup"></colgroup>
                                <thead>
                                <tr>
                                    <th class="checkbox-group"><input type="checkbox"></th>
                                    <th>No</th>
                                    <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">결제일</th>
                                    <th><img th:src="@{/image/sort_checked.svg}" alt="" class="svg-sort">이름</th>
                                    <th>청구 내역</th>
                                    <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">수납방법</th>
                                    <th>결제금액</th>
                                    <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">잔여금액</th>
                                    <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">현금영수증</th>
                                </tr>
                                </thead>
                            </table>
                            <!-- 스크롤 바디 테이블 -->
                            <div class="table-body-scroll" style="max-height: 76vh;">
                                <table class="basic-table pay-list-t yh table-body">
                                    <colgroup class="pay-colgroup"></colgroup>
                                    <tbody id="payment-list-body" class="stripe">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
<!-- section: modal(현금영수증) -->
<div th:replace="~{pay/pay-list-add-cashbill-modal :: addCashbillModal}"></div>
<!-- section: modal(납부내역추가) -->
<div th:replace="~{pay/pay-list-add-payment-modal :: addPaymentModal}"></div>

</body>
</html>
