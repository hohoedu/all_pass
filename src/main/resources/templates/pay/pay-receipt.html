<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/xpressengine/XEIcon/xeicon.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pay-receipt.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/pay/pay_receipt.js}"></script>
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <title>영수증(매출전표) 출력</title>
</head>

<body th:data-yy="${yy}"
      th:data-mm="${mm}"
      th:data-center-code="${centerCode}">

<div class="main-container">
    <div class="main-frame">

        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>

        <main class="main-info">
            <div class="student-frame">
                <section>

                    <div class="common-title">
                        <h2>매출전표 출력</h2>
                        <button class="common-btn pay-desc" id="btn-ledger-download">수강료 수출입 내역 다운로드</button>
                    </div>

                    <div class="receipt-layout">

                        <!-- 좌측 패널 -->
                        <div class="receipt-left">

                            <div class="month-header2">
                                <div class="month-title2">
                                    <span class="current-month" id="currentMonth"></span>
                                    <div style="position: relative;">
                                        <input type="month" id="monthPickerInput"
                                               class="hidden-date"
                                               th:value="${yy + '-' + mm}"
                                               style="opacity: 0; pointer-events: none;">
                                        <button type="button" class="icon-btn" id="openMonthPicker">
                                            <img th:src="@{/image/calendar.png}" alt="달력">
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="receipt-box-top">
                                <div class="receipt-left-search">
                                    <input type="text" class="basic-input" id="search-name"
                                           placeholder="학생명 / 승인번호 검색"
                                           th:value="${search}">
                                    <div class="explore common-btn sl4" id="btn-search">검색</div>
                                </div>
                                <div class="receipt-left-preview-btn">
                                    <div class="explore common-btn sl4" id="btn-preview">미리보기</div>
                                </div>
                            </div>

                            <div class="receipt-table-wrap mt">
                                <table class="basic-table receipt-table-t">
                                    <colgroup>
                                        <col style="width: 5%">
                                        <col style="width: 5%">
                                        <col style="width: 17%">
                                        <col style="width: 23%">
                                        <col style="width: 15%">
                                        <col style="width: 10%">
                                        <col style="width: 15%">
                                        <col style="width: 10%">
                                    </colgroup>
                                    <thead class="receipt-table-head">
                                    <tr>
                                        <th class="checkbox-group">
                                            <input type="checkbox" id="check-all">
                                        </th>
                                        <th>No</th>
                                        <th>이름</th>
                                        <th>수업</th>
                                        <th>결제금액</th>
                                        <th>카드정보</th>
                                        <th>결제일</th>
                                        <th>수납방법</th>
                                    </tr>
                                    </thead>
                                </table>

                                <div class="receipt-tbody-scroll">
                                    <table class="basic-table receipt-table-t yh">
                                        <colgroup>
                                            <col style="width: 5%">
                                            <col style="width: 5%">
                                            <col style="width: 17%">
                                            <col style="width: 23%">
                                            <col style="width: 15%">
                                            <col style="width: 10%">
                                            <col style="width: 15%">
                                            <col style="width: 10%">
                                        </colgroup>
                                        <tbody id="receipt-list-body" class="stripe">
                                        <th:block th:each="item, stat : ${students}">
                                            <tr class="receipt-row" th:data-key="${item.rowKey}">
                                                <td class="checkbox-group">
                                                    <input type="checkbox" th:value="${item.rowKey}">
                                                </td>
                                                <td th:text="${stat.count}"></td>
                                                <td th:text="${item.students[0].studentName}"></td>
                                                <td th:text="${item.students[0].className}"></td>
                                                <td th:text="${#numbers.formatInteger(item.amount, 0, 'COMMA') + '원'}"></td>
                                                <td th:text="${item.cardName}"></td>
                                                <td th:text="${item.paidDate}"></td>
                                                <td th:text="${item.payType}"></td>
                                            </tr>
                                            <tr th:each="sub, subStat : ${item.students}"
                                                th:if="${subStat.index > 0}"
                                                class="receipt-sub-row"
                                                th:data-key="${item.rowKey}">
                                                <td></td>
                                                <td class="sub-icon">└</td>
                                                <td th:text="${sub.studentName}"></td>
                                                <td th:text="${sub.className}"></td>
                                                <td colspan="4"></td>
                                            </tr>
                                        </th:block>
                                        <tr th:if="${students == null or #lists.isEmpty(students)}">
                                            <td colspan="8"
                                                style="text-align:center; padding:30px; color:#bbb; font-size:14px;">
                                                조회된 데이터가 없습니다.
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>

                        <!-- 우측 패널 -->
                        <div class="receipt-right">
                            <div class="receipt-preview-bg" id="previewBg">
                                <div class="receipt-empty-state" id="emptyState">
                                    <i class="xi-document-o"></i>
                                    <p>좌측 목록에서 항목을 선택하면<br>미리보기 버튼을 눌러주세요.</p>
                                </div>
                                <div id="receiptSheetWrap" style="display:none;"></div>
                            </div>
                        </div>

                    </div>

                </section>
            </div>
        </main>
    </div>
</div>

</body>
</html>
