<div th:fragment="centerNoticeInsertModal">
    <div class="modal notice-modal">
        <div class="pre-view" style="width:70vw;">
            <div class="">
                <div class="m-t-line" style="margin: 20px;">
                    <div>
                        <div class="pre-title">공지 등록하기</div>
                    </div>
                    <a href="#" class="btn-close"></a>
                </div>
                <div class="notice-modal-divide">
                    <div class="sms-left">
                        <div class="sms-frame">
                            <table class="notice-regist-table pay-edu-table sms-table bt">
                                <colgroup>
                                    <col width="10%">
                                    <col width="90%">
                                </colgroup>
                                <tbody>
                                    <tr>
                                        <td>제목</td>
                                        <td>
                                            <input type="text" placeholder="제목을 입력해주세요." style="width:100%;">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>부제목</td>
                                        <td>
                                            <input type="text" placeholder="부제목을 입력해주세요." style="width:100%;">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>아이콘</td>
                                        <td>

                                            <div class="custom-select-wrap">
                                                <div class="made-select" id="noticeSelect">
                                                    <div class="selected">
                                                        <img th:src="@{/image/notice01.png}" alt=""> 공지 아이콘
                                                        <span class="arrow"><i class="xi-angle-down"></i></span>
                                                    </div>
                                                    <ul class="select-options">
                                                        <li data-value="icon1">
                                                            <img th:src="@{/image/notice01.png}" alt=""> 공지 아이콘
                                                        </li>
                                                        <li data-value="icon2">
                                                            <img th:src="@{/image/notice02.png}" alt=""> 알림 아이콘
                                                        </li>
                                                        <li data-value="icon3">
                                                            <img th:src="@{/image/notice03.png}" alt=""> 긴급 아이콘
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>

                                        </td>
                                    </tr>
                                    <tr class="app-textarea">
                                        <td>내용</td>
                                        <td style="padding:0;">
                                            <textarea id="content" name="content"></textarea>
                                        </td>
                                    </tr>
                                    <tr class="">
                                        <td>링크</td>
                                        <td>
                                            <div id="linkRow" style="display: none;">
                                                <input id="linkUrl" name="content" readonly>
                                                <button class="save-url-btn" id="removeUrl">
                                                    <img th:src="@{/image/retract-icon.png}" alt="삭제">
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>이미지</td>
                                        <td>
                                            <div class="image-row">
                                                <div class="left-wrapper">
                                                    <input type="file" id="imageInput" accept="image/*"
                                                        style="display: none" />
                                                    <div class="image-name" id="imageNameWrapper"
                                                        style="display: none;">
                                                        <span id="fileName">image.png</span>
                                                        <button class="retract-btn" id="removeImage">
                                                            <img th:src="@{/image/retract-icon.png}" alt="삭제">
                                                        </button>
                                                    </div>
                                                    <input type="hidden" id="imagePath" name="imagePath">
                                                </div>

                                                <button class="submit-btn" id="uploadBtn">등록하기</button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="sms-right">
                        <div class="student-wrapper">
                            <div class="student-select">
                                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
                                    <h3 class="title" style="margin:0;">학생 선택</h3>
                                    <span id="selectedCount" style="font-size:13px; color:#555; font-weight:600;">0건 선택</span>
                                </div>
                                <div class="filter-group" data-group="grade">
                                    <span class="filter-label">학년별</span>
                                    <button class="filter-btn" data-value="5세">5세</button>
                                    <button class="filter-btn" data-value="6세">6세</button>
                                    <button class="filter-btn" data-value="7세">7세</button>
                                    <button class="filter-btn" data-value="초1">초1</button>
                                    <button class="filter-btn" data-value="초2">초2</button>
                                    <button class="filter-btn" data-value="초3">초3</button>
                                    <button class="filter-btn" data-value="초4">초4</button>
                                    <button class="filter-btn" data-value="초5">초5</button>
                                    <button class="filter-btn" data-value="초6">초6</button>
                                    <button class="filter-btn" data-value="중등">중등</button>
                                </div>
                                <div style="display: flex">
                                    <div class="filter-group" data-group="subject">
                                        <span class="filter-label">과목별</span>
                                        <button class="filter-btn fbl" data-value="1">한자</button>
                                        <button class="filter-btn fbl" data-value="2">독서</button>
                                    </div>
                                    <div class="filter-group" data-group="class">
                                        <span class="filter-label" style="margin-left: 10px;">수업별</span>
                                        <select id="classSelect" class="filter-select">
                                            <option value="">과목을 선택하세요</option>
                                        </select>
                                    </div>
                                    <div class="filter-group" id="hideSentGroup" style="display:none; align-items:center; margin-left: 10px;">
                                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer; font-size:13px; color:#555; white-space:nowrap;">
                                            <input type="checkbox" id="hideSentCheckbox">
                                            발송된 학생 숨기기
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="mt">
                                <div class="table-frame choose-frame">
                                    <table class="basic-table pay-table yh">
                                        <colgroup>
                                            <col id="colCheckbox" width="8%">
                                            <col id="colName" width="18%">
                                            <col id="colSubject" width="40%">
                                            <col id="colGrade" width="14%">
                                            <col id="colApp" width="10%">
                                            <col id="colSent" class="sent-status-col" width="10%">
                                        </colgroup>
                                        <thead>
                                            <tr>
                                                <th class="checkbox-group">
                                                    <input type="checkbox" id="selectAll">
                                                </th>
                                                <th class="sortable" data-column="name">
                                                    <img th:src="@{/image/sort_checked.svg}" alt="" class="svg-sort">이름
                                                </th>
                                                <th class="sortable" data-column="subject">
                                                    <img th:src="@{/image/sort.svg}" alt="" class="svg-sort">수강 과목
                                                </th>
                                                <th class="sortable" data-column="grade">
                                                    <img th:src="@{/image/sort.svg}" alt="" class="svg-sort">학년
                                                </th>
                                                <th>앱 알림</th>
                                                <th class="sent-status-col">발송여부</th>
                                            </tr>
                                        </thead>
                                        <tbody id="student-tbody" class="stripe">
                                            <tr th:each="student : ${studentList}" th:attr="data-grade=${student.grade},
             data-han-class=${student.hanClassName},
             data-han-class=${student.hanClassName},
             data-han-class-type=${student.hanClassType},
             data-book-class=${student.bookClassName},
             data-book-class-type=${student.bookClassType}">
                                                <td class="checkbox-group">
                                                    <input type="checkbox" th:value="${student.studentId}"
                                                        th:attr="data-token=${student.appToken},data-student-id=${student.studentId}">
                                                </td>
                                                <td th:text="${student.studentName}"></td>
                                                <td th:text="${student.subject}"></td>
                                                <td th:text="${student.grade}"></td>
                                                <td>
                                                    <img th:if="${student.appToken != null}"
                                                        th:src="@{/image/in_app.png}" style="width: 20px;">
                                                    <img th:if="${student.appToken == null}"
                                                        th:src="@{/image/no_app.png}" style="width: 20px;">
                                                </td>
                                                <td class="sent-status-col">
                                                    <span class="sent-badge" style="display:none; font-size:12px; color:#4f8df9; font-weight:600;">발송됨</span>
                                                </td>
                                            </tr>

                                            <tr th:if="${#lists.isEmpty(studentList)}">
                                                <td colspan="6" style="text-align: center;">조회된 학생이 없습니다.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="save-btn-frame" style="margin-top: 30px; margin-bottom: 30px">
                    <button class="common-btn regist-btn" id="saveNotice">저장</button>
                </div>
            </div>
        </div>
    </div>
</div>
