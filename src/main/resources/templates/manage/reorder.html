<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/manage/reorder.js}"></script>
    <!-- Html menu Load -->
    <script th:src="@{/js/sidebar.js}"></script>
    <title>교재 추가/반품</title>
</head>
<body>
<div class="main-container">
    <div class="main-frame">
        <!-- left nav bar -->
        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
        <main class="main-info">
            <div class="line-second-frame">
                <!-- section:left -->
                <section class="book-order return-left">
                    <div class="common-title">
                        <h2>추가/반품</h2>
                    </div>
                    <div class="stats-item-left">
                        <div class="month-title2 month-today">
                            <div style="position: relative;">
                                <div class="day-display">
                                    <span class="month-text"></span>
                                    <input type="month" class="hidden-date hidden-picker"/>
                                    <button type="button" class="icon-btn calendar-open">
                                        <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="reorder-flex">

                        <div class="etc-add">
                            <div class="radio-group reorder-radio">
                                <label class="radio-label">
                                    <input type="radio" name="orderType" value="ADD">
                                    <div class="small-title">추가</div>
                                </label>

                                <label class="radio-label">
                                    <input type="radio" name="orderType" value="RETURN">
                                    <div class="small-title">반품</div>
                                </label>
                            </div>
                        </div>
                        <div class="reorder-bottom">
                            <div class="all-add table-frame">
                                <div class="add-extra">
                                    <div class="basic-select">
                                        <select name="bookStep">
                                            <option value="step0">단계 선택</option>
                                        </select>
                                    </div>
                                    <div class="basic-select">
                                        <select name="bookChoice">
                                            <option value="">권수 선택</option>
                                        </select>
                                    </div>
                                    <div class="custom-spinner">
                                        <input type="number" min="0" max="100" step="1" value="0">
                                        <div class="spinner-buttons">
                                            <button type="button" class="increment-btn">▲</button>
                                            <button type="button" class="decrement-btn">▼</button>
                                        </div>
                                    </div>
                                    <div class="reason-box">
                                        <div>사유 입력:</div>
                                        <input type="text" name="" placeholder="사유를 입력해주세요.">
                                    </div>
                                </div>
                            </div>
                            <div>
                                <div class="book-add"><p>교재 추가하기</p></div>
                                <div class="all-order">

                                    <div class="add-order-view">
                                        추가 <span class="addition">0</span>권
                                    </div>

                                    <div class="return-order-view" style="display:none;">
                                        반품 <span class="takeback">0</span>권
                                    </div>

                                </div>
                                <div class="book-order-save">
                                    <div class="common-btn save-btn">저장하기</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="order-info">
                        <p>
                            - 주문기간 이내의 추가수량은 합산되어 최종수량으로 발송됩니다.
                        </p>
                        <p>
                            - 주문기간 이후의 추가/반품은 별도로 발송 및 회수 처리되며 추가 택배비가 발송할 수 있습니다.
                        </p>
                    </div>
                </section>
                <!-- gray line -->
                <div class="divider"></div>
                <!-- section:right -->
                <section class="pre-order return-right">
                    <div class="common-title">
                        <h2>이전 주문 내역</h2>
                    </div>
                    <div class="preorder-select">
                        <div class="preorder-day">
                            <div class="month-title2 month-today">
                                <div style="position: relative;">
                                    <div class="day-display">
                                        <span class="month-text"></span>
                                        <input type="month" class="hidden-date hidden-picker"/>
                                        <button type="button" class="icon-btn calendar-open">
                                            <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="basic-select">
                            <select id="step-all" name="">
                                <option value="">전체</option>
                                <option value="">호호하니 영재</option>
                                <option value="">호호하니 수재</option>
                                <option value="">호호하니 신동</option>
                            </select>
                        </div>
                    </div>
                    <div class="class-info">
                        <div class="table-frame preorder-frame mt">
                            <table class="basic-table yh">
                                <colgroup>
                                    <col width="10%">
                                    <col width="10%">
                                    <col width="10%">
                                    <col width="10%">
                                    <col width="20%">
                                    <col width="15%">
                                    <col width="10%">
                                    <col width="5%">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th>주문구분</th>
                                    <th>단계</th>
                                    <th>교재</th>
                                    <th>수량</th>
                                    <th>사유</th>
                                    <th>등록일시</th>
                                    <th>승인여부</th>
                                    <th>취소</th>
                                </tr>
                                </thead>
                                <tbody class="stripe">
                                <tr>
                                    <td>추가주문</td>
                                    <td>호호하니 영재</td>
                                    <td>2호</td>
                                    <td>1</td>
                                    <td>신규입회</td>
                                    <td>2025.12.03 16:40</td>
                                    <td>승인</td>
                                    <td>아이콘</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
</body>
</html>
