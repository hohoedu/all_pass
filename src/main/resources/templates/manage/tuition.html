<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/manage/tuition.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/manage/tuition.js}"></script>
    <!-- Html menu Load -->
    <script th:src="@{/js/sidebar.js}"></script>
    <title>교육비 관리</title>
</head>
<body>
<div class="main-container">
    <div class="main-frame">
        <!-- left nav bar -->
        <aside id="sidebar-load" th:replace="~{sidebar::sidebar }"></aside>
        <main class="main-info">
            <input type="hidden" id="centerCode" th:value="${centerCode}">
            <div class="tuition-main-frame">
                <!-- section:top -->
                <section class="tuition-top-frame">
                    <div class="common-title" style="margin-bottom: 10px;">
                        <h2>과목별 수강료 설정</h2>
                        <div class="common-btn commission-save" id="fee-save-btn">저장하기</div>
                    </div>
                    <div class="lump-sum">
                        <div class="radio-group">
                            <input type="radio" name="feeMethod" id="fee-submit" checked>
                            <div>
                                <label for="fee-submit">수강료 일괄 적용</label>
                                <input type="text" class="basic-input edu-input no-spin" id="fee-input">
                            </div>
                        </div>
                        <div class="radio-group">
                            <input type="radio" name="feeMethod" id="fee-each">
                            <label for="fee-each">수강료 개별 적용</label>
                        </div>
                    </div>
                </section>
                <div class="tuition-table-frame">
                    <section>
                        <div class="table-frame tuition-frame">
                            <div class="table-scroll">
                                <table class="member-status-table tution-table bt">
                                    <colgroup>
                                        <col width="20%">
                                        <col width="30%">
                                        <col width="40%">
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th>분류</th>
                                        <th>과목</th>
                                        <th>수강료</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="cls, stat : ${hanClasses}">
                                        <td th:if="${stat.index == 0}" th:rowspan="${#lists.size(bookClasses)}">독서 교육비</td>
                                        <td th:text="${cls.className}"></td>
                                        <td>
                                            <input type="number"
                                                   step="10000"
                                                   class="basic-input edu-input"
                                                   th:name="'fee_' + ${cls.classKey}"
                                                   th:value="${hanFeeMap.containsKey(cls.classKey) ? hanFeeMap[cls.classKey] : ''}"/>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>


                    <!-- section:center -->
                    <section>
                        <div class="table-frame tuition-frame">
                            <table class="member-status-table tution-table bt">
                                <colgroup>
                                    <col width="20%">
                                    <col width="30%">
                                    <col width="40%">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th>분류</th>
                                    <th>과목</th>
                                    <th>수강료</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="cls, stat : ${bookClasses}">
                                    <td th:if="${stat.index == 0}" th:rowspan="${#lists.size(bookClasses)}">독서 교육비</td>
                                    <td th:text="${cls.className}"></td>
                                    <td>
                                        <input type="number"
                                               step="10000"
                                               class="basic-input edu-input"
                                               th:name="'fee_' + ${cls.classKey}"
                                               th:value="${bookFeeMap.containsKey(cls.classKey) ? bookFeeMap[cls.classKey] : ''}"/>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                    <!-- section:right-->
                    <section>
                        <div class="table-frame tuition-frame">
                            <table class="member-status-table tution-table bt">
                                <colgroup>
                                    <col width="20%">
                                    <col width="30%">
                                    <col width="40%">
                                </colgroup>
                                <thead>
                                <th>분류</th>
                                <th>과목</th>
                                <th>수강료</th>
                                </thead>
                                <tbody>
                                <tr>
                                    <td rowspan="7">한자 교육비</td>
                                    <td>호호하니 영재</td>
                                    <td>
                                        <input type="number" class="basic-input edu-input">
                                    </td>
                                </tr>
                                <tr>
                                    <td>호호하니 수재</td>
                                    <td>
                                        <input type="number" class="basic-input edu-input">
                                    </td>
                                </tr>
                                <tr>
                                    <td>호호하니 신동</td>
                                    <td>
                                        <input type="number" class="basic-input edu-input">
                                    </td>
                                </tr>
                                <tr>
                                    <td>초등신동</td>
                                    <td>
                                        <input type="number" class="basic-input edu-input">
                                    </td>
                                </tr>
                                <tr>
                                    <td>초등천재</td>
                                    <td>
                                        <input type="number" class="basic-input edu-input">
                                    </td>
                                </tr>
                                <tr>
                                    <td>초등수재</td>
                                    <td>
                                        <input type="number" class="basic-input edu-input">
                                    </td>
                                </tr>
                                <tr>
                                    <td>초등박사</td>
                                    <td>
                                        <input type="number" class="basic-input edu-input">
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>
<script>
    const feeSubmit = document.getElementById('fee-submit');
    const feeEach = document.getElementById('fee-each');
    const feeInput = document.getElementById('fee-input');

    function updateInputState() {
        if (feeEach.checked) {
            feeInput.disabled = true; // 비활성화
            feeInput.classList.add('disabled');
        } else {
            feeInput.disabled = false;
            feeInput.classList.remove('disabled');
        }
    }

    feeSubmit.addEventListener('change', updateInputState);
    feeEach.addEventListener('change', updateInputState);

    // 초기 상태 반영
    updateInputState();
</script>
</body>
</html>
