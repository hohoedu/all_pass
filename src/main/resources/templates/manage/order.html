<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/manage/order.js}"></script>
    <!-- Html menu Load -->
    <script th:src="@{/js/sidebar.js}"></script>
    <title>교재 주문</title>
</head>
<body>
<div class="main-container">
    <div class="main-frame">
        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
        <main class="main-info">
            <div class="line-second-frame">
                <!-- section:left -->
                <section class="book-order">
                    <div class="common-title">
                        <h2>교재 주문</h2>
                    </div>
                    <div class="order-flex">
                        <div class="order-top">
                            <div class="stats-item-left">
                                <div class="month-title2 month-today">
                                    <span class="current-month"></span>
                                    <div style="position: relative;">
                                        <div class="day-display">
                                            <input type="month" class="hidden-date hidden-picker"/>
                                            <button type="button" class="icon-btn calendar-open">
                                                <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="table-frame makeup-table mt">
                                <table class="basic-table order-table yh">
                                    <colgroup>
                                        <col width="40%">
                                        <col width="30%">
                                        <col width="30%">
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th>단계</th>
                                        <th>교재</th>
                                        <th>기본수량</th>
                                    </tr>
                                    </thead>
                                    <tbody id="order-left-body" class="stripe">

                                    <tr th:if="${baseOrderList == null or baseOrderList.isEmpty()}">
                                        <td colspan="3" style="text-align:center; padding: 20px; ">
                                            등록된 수업이 없습니다.
                                        </td>
                                    </tr>

                                    <tr th:each="baseOrder : ${baseOrderList}"
                                        th:data-class-key="${baseOrder.classKey}"
                                        th:data-unit-key="${baseOrder.unitKey}">
                                        <td th:text="${baseOrder.className}">수업</td>
                                        <td th:text="${baseOrder.unitName}">진도</td>
                                        <td th:text="${baseOrder.baseCount}">기본수량</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="all-order">
                                총 <span></span>권
                            </div>
                            <div class="book-order-save">
                                <div class="common-btn save-btn">저장하기</div>
                            </div>
                        </div>
                        <div class="order-info">
                            <p>
                                - 주문년월은 등록한 시간표 상의 데이터 기준입니다.
                            </p>
                            <p>
                                - 주문 마감일은 <span>매월 10일</span>이며, 최종으로 저장된 데이터가 발송됩니다.
                            </p>
                            <p>
                                - 추가/반품은 [운영 관리]-[교재 추가/반품]메뉴를 이용해 주세요.
                            </p>
                        </div>
                    </div>
                </section>
                <!-- gray line -->
                <div class="divider"></div>
                <!-- section:right -->
                <section class="pre-order">
                    <div class="common-title">
                        <h2>주문 내역</h2>
                    </div>
                    <div class="preorder-select">
                        <div class="preorder-day">
                            <div class="basic-select">
                                <select id="order-year" name="year">

                                </select>
                            </div>
                            <div class="basic-select">
                                <select id="order-month" name="month">

                                </select>
                            </div>
                            <div class="basic-select">
                                <select id="order-history" name="month">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="class-info">
                        <div class="table-frame preorder-frame mt">
                            <table class="basic-table yh">
                                <thead>
                                <tr>
                                    <th>단계</th>
                                    <th>교재</th>
                                    <th>주문수량</th>
                                    <th>최종수량</th>
                                </tr>
                                </thead>
                                <tbody id="order-right-body" class="stripe">

                                <tr th:if="${savedOrderList == null or savedOrderList.isEmpty()}">
                                    <td colspan="4" style="text-align:center; padding: 20px;">
                                        주문 내역이 없습니다.
                                    </td>
                                </tr>

                                <tr th:each="savedOrder : ${savedOrderList}"
                                    th:data-class-key="${savedOrder.classKey}"
                                    th:data-unit-key="${savedOrder.unitKey}">
                                    <td th:text="${savedOrder.className}"></td>
                                    <td th:text="${savedOrder.unitName}"></td>
                                    <td th:text="${savedOrder.baseCount}"></td>
                                    <td th:text="${savedOrder.totalCount}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
</body>
</html>
