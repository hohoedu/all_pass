<div th:fragment="attendance" id="tab4" class="tab">
    <div class="modal-scroll">
        <div class="card-common" style="border: none;">
            <div class="small-title" style="margin-bottom: 20px;">출결</div>

            <!-- 월 네비게이션 -->
            <div class="att-nav-wrap">
                <button type="button" id="calendar-prev" class="att-nav-btn">&#8249;</button>
                <span id="calendar-title" class="att-nav-title"></span>
                <button type="button" id="calendar-next" class="att-nav-btn">&#8250;</button>
            </div>

            <!-- 출결 상태 범례 -->
            <div class="att-legend">
                <span class="att-badge att-present">출석</span>
                <span class="att-badge att-late">지각</span>
                <span class="att-badge att-absent">결석</span>
            </div>

            <!-- 달력 -->
            <div class="calendar-container">
                <table class="calendar-table">
                    <thead>
                    <tr>
                        <th>일</th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                        <th>목</th>
                        <th>금</th>
                        <th>토</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
