<div th:fragment="payment" id="tab3" class="tab">
    <div class="modal-scroll">
        <div class="modal-inner">
            <div class="small-title" style="margin-top: 30px;">수강과목(한자)</div>
            <table class="base-info-t">
                <tbody>
                <tr>
                    <th>한자 단계</th>
                    <td>
                        <div class="select-wrap">
                            <select name="hanjaLevel" id="hanja" class="styled-select">
                                <option value="" class="s_subjects"></option>
                                <th:block th:each="code : ${classCodes}">
                                    <option th:if="${code.classType == '1'}"
                                            th:value="${code.classKey}" th:text="${code.className}">
                                    </option>
                                </th:block>
                            </select>
                        </div>
                    </td>
                    <th>수강 상태</th>
                    <td class="choose-group">
                        <button type="button" class="btn-choose" data-value="수강">수강</button>
                        <button type="button" class="btn-choose active" data-value="미수강">미수강</button>
                        <input type="hidden" name="status" value="수강"/>
                    </td>
                </tr>
                <tr>
                    <th>담당 선생님</th>
                    <td>
                        <div class="select-wrap">
                            <select name="hanjaTeacher" id="han-teacher" class="styled-select">
                                <option value="" class="s_users"></option>
                                <th:block th:each="u : ${users}">
                                    <option th:value="${u.userCode}" th:text="${u.userName} + 선생님"></option>
                                </th:block>
                            </select>
                        </div>
                    </td>

                    <th>시작일자</th>
                    <td class="icon-field day-picker" style="position: relative;">
                        <div class="day-display">날짜를 선택해주세요.</div> <!-- 표시 영역 -->
                        <div>
                            <input type="date" class="birth-input hidden-picker"/>
                            <button type="button" class="icon-btn birth-btn">
                                <img th:src="@{/image/calendar.png}" alt="달력 아이콘"/>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th class="tuition-fee">교육비</th>
                    <td>
                        <input type="text" name="hanFee" class="no-spin" id="hanFee">
                    </td>
                    <th>교재비</th>
                    <td>
                        <input type="text" name="hanMaterialFee" class="no-spin book-fee" id="hanMaterialFee">
                    </td>
                </tr>
                </tbody>

            </table>
            <!-- 수강과목(독서) -->
            <div class="small-title">수강과목(독서)</div>
            <table class="base-info-t" style="margin-bottom: 5px;">
                <tbody>
                <tr>
                    <th>독서 단계</th>
                    <td>
                        <div class="select-wrap">
                            <select name="hanjaLevel" id="book" class="styled-select">
                                <th:block th:each="code : ${classCodes}">
                                    <option th:if="${code.classType == '2'}"
                                            th:value="${code.classKey}" th:text="${code.className}">
                                    </option>
                                </th:block>
                            </select>
                        </div>
                    </td>
                    <th>수강 상태</th>
                    <td class="choose-group">
                        <button type="button" class="btn-choose active" data-value="수강">수강</button>
                        <button type="button" class="btn-choose" data-value="미수강">미수강</button>
                        <input type="hidden" name="status" value="수강"/>
                    </td>
                </tr>
                <tr>
                    <th>담당 선생님</th>
                    <td>
                        <div class="select-wrap">
                            <select name="bookTeacher" id="book-teacher" class="styled-select">
                                <option value="" class="s_users"></option>
                                <th:block th:each="u : ${users}">
                                    <option th:value="${u.userCode}" th:text="${u.userName} + 선생님"></option>
                                </th:block>
                            </select>
                        </div>
                    </td>
                    <th>시작일자</th>
                    <td class="icon-field day-picker" style="position: relative;">
                        <div class="day-display">날짜를 선택해주세요.</div>
                        <div>
                            <input type="date" class="birth-input hidden-picker"/>
                            <button type="button" class="icon-btn birth-btn">
                                <img th:src="@{/image/calendar.png}" alt="달력 아이콘"/>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th class="tuition-fee">교육비</th>
                    <td>
                        <input type="text" name="bookFee" class="no-spin" id="bookFee">
                    </td>
                    <th>교재비</th>
                    <td>
                        <input type="text" name="bookMaterialFee" class="no-spin book-fee" id="bookMaterialFee">
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="dues-sum">
                <p>회비 합계&nbsp;&nbsp;<span> 230,000</span>&nbsp;원</p>
            </div>
            <div class="save-btn-frame">
                <button class="save-btn" id="student-tab-3-save-btn">저장</button>
            </div>
        </div>
    </div>
</div>
