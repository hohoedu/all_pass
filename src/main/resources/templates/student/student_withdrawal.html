<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <link rel="stylesheet" th:href="@{/css/student.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/student/student_withdraw.js}" defer></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <title>입·탈퇴 현황</title>
</head>
<body>
<div class="main-container">
    <div class="main-frame">
        <div id="sidebar-load" th:replace="~{sidebar :: sidebar}"></div>
        <main class="main-info">
            <div class="student-frame">
                <section class="info-summary">
                    <div class="common-title">
                        <h2>입·탈퇴 현황</h2>
                        <div class="inout-btns">
                            <a class="print" href="#" id="print-withdraw">인쇄</a>
                        </div>
                    </div>

                    <div class="month-header">
                        <div style="flex:1;"></div>
                        <div class="month-title month-today">
                            <span class="current-month" id="currentMonth"></span>
                            <div class="calendar-wrapper">
                                <input type="month" id="monthPickerInput" class="hidden-date"
                                       th:value="${selectedMonthValue}"/>
                                <button type="button" class="icon-btn calendar-open" id="openMonthPicker">
                                    <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                                </button>
                            </div>
                        </div>
                        <div class="info-arrange">
                            <div class="stu-left">
                                <div class="basic-select sl1">
                                    <select name="teacher" id="teacher-filter">
                                        <option th:each="teacher : ${teachers}"
                                                th:value="${teacher.userCode}"
                                                th:text="${teacher.userName + ' 선생님'}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="status-tabs-wrap">
                        <div class="status-tabs" role="tablist">
                            <button class="status-tab is-active" type="button" data-tab="t1" aria-selected="true"
                                    style="--txt:#588c39; --bg:#eaf7ef; --bg-active:#2c941b">
                                <span class="left"><span class="label">입회</span></span>
                                <span class="count">0명</span>
                            </button>
                            <button class="status-tab" type="button" data-tab="t2" aria-selected="false"
                                    style="--txt:#b16081; --bg:#fdecef; --bg-active:#c5446d">
                                <span class="left"><span class="label">탈퇴</span></span>
                                <span class="count">0명</span>
                            </button>
                            <button class="status-tab" type="button" data-tab="t3" aria-selected="false"
                                    style="--txt:#5b66aa; --bg:#edf4ff; --bg-active:#4e5aa6">
                                <span class="left"><span class="label">전입</span></span>
                                <span class="count">0명</span>
                            </button>
                            <button class="status-tab" type="button" data-tab="t4" aria-selected="false"
                                    style="--txt:#c38528; --bg:#fff4e7; --bg-active:#d68f26">
                                <span class="left"><span class="label">전출</span></span>
                                <span class="count">0명</span>
                            </button>
                            <button class="status-tab" type="button" data-tab="t5" aria-selected="false"
                                    style="--txt:#898989; --bg:#f6f6f6; --bg-active:#828282">
                                <span class="left"><span class="label">졸업</span></span>
                                <span class="count">0명</span>
                            </button>
                        </div>
                    </div>

                    <div class="status-panels">

                        <!-- 입회 -->
                        <div class="status-panel is-active" data-panel="t1">
                            <div class="mt">
                                <div class="table-frame stu-info-t">
                                    <table class="basic-table yh">
                                        <thead>
                                        <tr>
                                            <th>No</th>
                                            <th>이름</th>
                                            <th>수강과목</th>
                                            <th>담당선생님</th>
                                            <th>학년</th>
                                            <th>입회일</th>
                                            <th>입회 취소</th>
                                        </tr>
                                        </thead>
                                        <tbody class="stripe"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- 탈퇴 -->
                        <div class="status-panel" data-panel="t2">
                            <div class="mt">
                                <div class="table-frame stu-info-t">
                                    <table class="basic-table yh">
                                        <colgroup>
                                            <col width="5%">
                                            <col width="10%">
                                            <col width="10%">
                                            <col width="10%">
                                            <col width="10%">
                                            <col width="10%">
                                            <col width="10%">
                                            <col width="15%">
                                            <col width="10%">
                                        </colgroup>
                                        <thead>
                                        <tr>
                                            <th>No</th>
                                            <th>이름</th>
                                            <th>수강과목</th>
                                            <th>담당선생님</th>
                                            <th>학년</th>
                                            <th>입회일</th>
                                            <th>탈퇴일</th>
                                            <th>탈퇴사유</th>
                                            <th>탈퇴 취소</th>
                                        </tr>
                                        </thead>
                                        <tbody class="stripe"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- 전입 -->
                        <div class="status-panel" data-panel="t3">
                            <div class="mt">
                                <div class="table-frame stu-info-t">
                                    <table class="basic-table yh">
                                        <colgroup>
                                            <col width="5%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="15%">
                                            <col width="8%">
                                        </colgroup>
                                        <thead>
                                        <tr>
                                            <th>No</th>
                                            <th>이름</th>
                                            <th>수강과목</th>
                                            <th>전입선생님</th>
                                            <th>전출선생님</th>
                                            <th>학년</th>
                                            <th>입회일</th>
                                            <th>전입일</th>
                                            <th>전입사유</th>
                                            <th>전입 취소</th>
                                        </tr>
                                        </thead>
                                        <tbody class="stripe"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- 전출 -->
                        <div class="status-panel" data-panel="t4">
                            <div class="mt">
                                <div class="table-frame stu-info-t">
                                    <table class="basic-table yh">
                                        <colgroup>
                                            <col width="5%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="15%">
                                            <col width="8%">
                                        </colgroup>
                                        <thead>
                                        <tr>
                                            <th>No</th>
                                            <th>이름</th>
                                            <th>수강과목</th>
                                            <th>전입선생님</th>
                                            <th>전출선생님</th>
                                            <th>학년</th>
                                            <th>입회일</th>
                                            <th>전출일</th>
                                            <th>전출사유</th>
                                            <th>전출 취소</th>
                                        </tr>
                                        </thead>
                                        <tbody class="stripe"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- 졸업 -->
                        <div class="status-panel" data-panel="t5">
                            <div class="mt">
                                <div class="table-frame stu-info-t">
                                    <table class="basic-table yh">
                                        <colgroup>
                                            <col width="5%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="8%">
                                            <col width="15%">
                                        </colgroup>
                                        <thead>
                                        <tr>
                                            <th>No</th>
                                            <th>이름</th>
                                            <th>수강과목</th>
                                            <th>담당선생님</th>
                                            <th>학년</th>
                                            <th>입회일</th>
                                            <th>졸업일</th>
                                            <th>사유</th>
                                        </tr>
                                        </thead>
                                        <tbody class="stripe"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
</body>
</html>
