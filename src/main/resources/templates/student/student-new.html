<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- fontawesome CDN -->
    <script src="https://kit.fontawesome.com/180a7620c6.js" crossorigin="anonymous"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <link rel="stylesheet" th:href="@{/css/student.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:inline="javascript">
        const pendingStudents = /*[[${students}]]*/ [];
    </script>
    <script th:src="@{/js/student/student_new.js}"></script>
    <!-- Html menu Load -->
    <script th:src="@{/js/sidebar.js}"></script>

    <title>신규 입회</title>
</head>
<body>
<div class="main-container">
    <div class="main-frame">
        <!-- left nav bar -->
        <div id="sidebar-load" th:replace="~{sidebar :: sidebar}"></div>
        <main class="main-info">
            <div class="student-frame">
                <!-- section:left -->
                <section class="info-summary">
                    <div class="common-title">
                        <h2>신규 입회</h2>
                        <div class="inout-btns">
                            <a class="print" href="#">
                                인쇄
                            </a>
                        </div>
                    </div>
                    <div>
                        <div class="mt">
                            <div class="table-frame stu-info-t">
                                <table class="basic-table yh">
                                    <colgroup>
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th>No</th>
                                        <th><img th:src="@{/image/sort_checked.svg}" alt="" class="svg-sort">이름</th>
                                        <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">학년</th>
                                        <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">수강과목</th>
                                        <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">연락처</th>
                                        <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">발송 담당자</th>
                                        <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">가입 여부</th>
                                        <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">가입일</th>
                                        <th>재발송</th>
                                        <th>입회 취소</th>
                                    </tr>
                                    </thead>
                                    <tbody id="student-tbody" class="stripe">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{student/student-new-modal :: studentNewModal}"></div>
</body>
</html>
