<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Custom Css / Js -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/media.css}">
  <script th:src="@{/js/custom.js}"></script>
  <!-- Html menu Load -->
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:src="@{/js/student.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>입·탈퇴 관리</title>
</head>

<body>
  <div class="main-container">
    <div class="main-frame">
      <!-- left nav bar -->
      <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
      <main class="main-info">
        <!-- section:left -->
        <div class="student-frame">
          <section>
            <div class="top-flex">
              <div class="common-title">
                <h2>학생현황 통계</h2>
              </div>
              <a class="print" th:href="@{/student/print-overview}">인쇄</a>
            </div>
            <div class="stats-filter">
              <!-- 좌측: 기간 선택 -->
              <div class="stats-item-left">
                <div class="radio-group">
                  <input type="radio" name="period" id="period-1year" value="1y" checked>
                  <label for="period-1year">1년</label>
                  <input type="radio" name="period" id="period-6month" value="6m">
                  <label for="period-6month">6개월</label>
                  <input type="radio" name="period" id="period-3month" value="3m">
                  <label for="period-3month">3개월</label>
                  <input type="radio" name="period" id="period-custom" value="custom">
                  <label for="period-custom">일자지정</label>
                </div>
                <div class="icon-field basic-input cal-adjust" style="margin-bottom: 0;">
                  <span id="selectedDateRange">2024-07 ~ 2025-06</span>
                  <button class="icon-btn" id="calendarBtn" style="background: transparent;">
                    <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                  </button>
                  <input type="month" id="calendarInput" style="opacity: 0; position: absolute; pointer-events: none;">
                </div>
              </div>
              <!-- 우측: 선택 필터 + 버튼 -->
              <div class="teacher-search">
                <div class="basic-select" style="box-sizing: border-box;">
                  <select name="teacher" id="teacher-select" style="width: 200px;">
                    <option value="all">선생님 전체</option>
                    <th:block th:each="t: ${teachers}">
                      <option th:value="${t.userNo}" th:text="${t.username}+ ' 선생님'"></option>
                    </th:block>
                  </select>
                </div>
                <div class="explore common-btn">검색</div>
              </div>
            </div>
            <div class="student-out-inner">
              <div class="second-frame" style="padding: 20px 0;">
                <div class="stats-left">
                  <div class="bt">
                    <div class="table-frame stats-frame">
                      <table class="basic-table yh table-head">
                        <colgroup>
                          <col width="20%">
                          <col width="15%">
                          <col width="15%">
                          <col width="15%">
                          <col width="15%">
                          <col width="15%">
                          <col width="15%">
                        </colgroup>
                        <thead>
                          <tr>
                            <th>연도-월</th>
                            <th>재원</th>
                            <th>입회</th>
                            <th>전입</th>
                            <th>휴원</th>
                            <th>전출</th>
                            <th>탈퇴</th>
                          </tr>
                        </thead>
                      </table>

                      <div class="table-body-scroll">
                        <table class="basic-table yh table-body">
                          <colgroup>
                            <col width="20%">
                            <col width="15%">
                            <col width="15%">
                            <col width="15%">
                            <col width="15%">
                            <col width="15%">
                            <col width="15%">
                          </colgroup>
                          <tbody id="student-tbody" class="stripe">
                            <tr th:each="snap : ${snapshot}">
                              <td th:text="${snap.snapshotYm}"></td>
                              <td th:text="${snap.activeCount}"></td>
                              <td th:text="${snap.entryCount}"></td>
                              <td th:text="${snap.moveInCount}"></td>
                              <td th:text="${snap.restCount}"></td>
                              <td th:text="${snap.moveOutCount}"></td>
                              <td th:text="${snap.withdrawnCount}"></td>
                            </tr>
                            <tr th:each="snap : ${snapshot}">
                              <td th:text="${snap.snapshotYm}"></td>
                              <td th:text="${snap.activeCount}"></td>
                              <td th:text="${snap.entryCount}"></td>
                              <td th:text="${snap.moveInCount}"></td>
                              <td th:text="${snap.restCount}"></td>
                              <td th:text="${snap.moveOutCount}"></td>
                              <td th:text="${snap.withdrawnCount}"></td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                      <table class="basic-table yh out-tfoot">
                        <colgroup>
                          <col width="20%">
                          <col width="15%">
                          <col width="15%">
                          <col width="15%">
                          <col width="15%">
                          <col width="15%">
                          <col width="15%">
                        </colgroup>
                        <div class="mt">
                          <tfoot>
                            <tr>
                              <td>합계</td>
                              <td>890</td>
                              <td>49</td>
                              <td>49</td>
                              <td>49</td>
                              <td>157</td>
                              <td>140</td>
                            </tr>
                          </tfoot>
                        </div>
                      </table>
                    </div>
                  </div>
                  <div class="graduate">
                    *졸업자: <span>5</span>명
                  </div>
                </div>
                <div class="stats-right">
                  <div class="chart-box">
                    <h2>현황 그래프</h2>
                    <div class="chart-buttons">
                      <button class="active-재원">재원</button>
                      <button>전입</button>
                      <button>전출</button>
                      <button class="active-입회">입회</button>
                      <button class="active-탈퇴">탈퇴</button>
                    </div>
                    <canvas id="studentChart" width="600" height="400" style="background: #fff;"></canvas>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script th:inline="javascript">
    const initialSnapshotData = /*[[${snapshot}]]*/[];
  </script>
</body>

</html>
