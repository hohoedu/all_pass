<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>형제 등록</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
        }
        h2 {
            margin-bottom: 12px;
        }
        .box {
            border: 1px solid #ddd;
            padding: 16px;
            margin-bottom: 24px;
        }
        .list {
            margin-top: 8px;
        }
        .list li {
            margin-bottom: 6px;
        }
        .search-result {
            cursor: pointer;
            padding: 6px;
            border-bottom: 1px solid #eee;
        }
        .search-result:hover {
            background: #f5f5f5;
        }
        .selected {
            background: #e0f3ff;
        }
        .actions {
            margin-top: 16px;
        }
        button {
            padding: 8px 16px;
        }
    </style>
</head>
<body>

<!-- 학생 A 기본 정보 -->
<div class="box">
    <h2>학생 정보</h2>
    <p><strong>이름:</strong> 학생 A</p>
    <p><strong>학년:</strong> 초등 3</p>
</div>

<!-- 현재 형제 목록 -->
<div class="box">
    <h2>현재 형제</h2>
    <ul class="list">
        <li>학생 B <button type="button">해제</button></li>
        <!-- 형제 없으면 -->
        <!-- <li>등록된 형제가 없습니다.</li> -->
    </ul>
</div>

<!-- 형제 추가 -->
<div class="box">
    <h2>형제 추가</h2>

    <!-- 검색 -->
    <input type="text" placeholder="학생 이름 또는 전화번호 검색" />
    <button type="button">검색</button>

    <!-- 검색 결과 -->
    <div class="list">
        <div class="search-result">
            학생 C (초등 1)
        </div>
        <div class="search-result selected">
            학생 D (유치부)
        </div>
    </div>

    <!-- 저장 -->
    <div class="actions">
        <button type="button">형제 등록 저장</button>
    </div>
</div>

</body>
</html>
