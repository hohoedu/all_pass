<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App ID 조회</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ── 팝업 래퍼 ── */
        .popup-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: fixed;
            inset: 0;
        }

        .popup-box {
            background: #fff;
            border-radius: 12px;
            width: 750px;
            max-width: 100vw;
            height: 550px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
            overflow: hidden;
            animation: popIn 0.22s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.93); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        /* ── 헤더 ── */
        .popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px 16px;
            border-bottom: 1px solid #e9eaec;
            flex-shrink: 0;
        }

        .popup-header .title {
            font-size: 16px;
            font-weight: 700;
            color: #222;
            letter-spacing: -0.3px;
        }

        /* ── 본문 ── */
        .popup-body {
            padding: 20px 24px 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        /* ── 검색 영역 ── */
        .search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .search-row input[type="text"] {
            flex: 1;
            height: 40px;
            border: 1px solid #e9eaec;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border 0.15s;
        }

        .search-row input[type="text"]:focus {
            border-color: #5c8af5;
        }

        .btn-search {
            height: 40px;
            padding: 0 20px;
            background: #5c8af5;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
        }

        .btn-search:hover { background: #3f6fe0; }

        /* ── 테이블 래퍼: 헤더 고정 + 바디 스크롤 ── */
        .result-table-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #e9eaec;
            border-radius: 8px;
            overflow: hidden;
            min-height: 0;
        }

        /* 고정 헤더 */
        .result-table-head {
            flex-shrink: 0;
            background: #f7f8fa;
            border-bottom: 1px solid #e9eaec;
        }

        /* 스크롤 바디 */
        .result-table-body {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .result-table-body::-webkit-scrollbar { width: 6px; }
        .result-table-body::-webkit-scrollbar-track { background: #f7f8fa; }
        .result-table-body::-webkit-scrollbar-thumb { background: #d0d4dc; border-radius: 3px; }
        .result-table-body::-webkit-scrollbar-thumb:hover { background: #a0a6b5; }

        /* 헤더/바디 테이블 공통 */
        .result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            table-layout: fixed;
        }

        .result-table th {
            padding: 11px 10px;
            text-align: center;
            font-weight: 600;
            color: #555;
            font-size: 13px;
        }

        .result-table td {
            padding: 10px;
            text-align: center;
            color: #333;
            border-bottom: 1px solid #f2f3f5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .result-table-body tr:last-child td { border-bottom: none; }
        .result-table-body tr:hover td { background: #f5f8ff; }

        /* 현재 App ID chip */
        .id-chip {
            display: inline-block;
            background: #eef3ff;
            color: #3a5fcf;
            border-radius: 4px;
            padding: 2px 8px;
            font-family: 'Consolas', 'D2Coding', monospace;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .id-chip.none {
            background: #f5f5f5;
            color: #bbb;
            font-style: italic;
        }

        /* 이전 App ID 입력 input */
        .input-prev-app-id {
            width: 100%;
            height: 32px;
            border: 1px solid #e9c87a;
            border-radius: 5px;
            padding: 0 8px;
            font-size: 12px;
            font-family: 'Consolas', 'D2Coding', monospace;
            color: #b35a00;
            background: #fff8ee;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
            text-align: center;
        }

        .input-prev-app-id:focus {
            border-color: #f0a040;
            box-shadow: 0 0 0 2px rgba(240,160,64,0.15);
        }

        .input-prev-app-id::placeholder {
            color: #ccc;
            font-style: italic;
            font-family: 'Malgun Gothic', sans-serif;
            font-size: 11px;
        }

        /* 저장 버튼 */
        .btn-save-id {
            height: 30px;
            padding: 0 14px;
            background: #5c8af5;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.13s;
            white-space: nowrap;
        }

        .btn-save-id:hover    { background: #3f6fe0; }
        .btn-save-id:disabled { background: #aab8e8; cursor: not-allowed; }
        .btn-save-id.saved    { background: #2caa6e; }

        /* 빈 상태 / 로딩 */
        .state-row td {
            padding: 40px 0 !important;
            color: #aaa;
            font-size: 13px;
            text-align: center;
        }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #222;
            color: #fff;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="popup-overlay">
    <div class="popup-box">

        <!-- 헤더 -->
        <div class="popup-header">
            <span class="title">App ID 조회</span>
        </div>

        <!-- 본문 -->
        <div class="popup-body">

            <!-- 검색 -->
            <div class="search-row">
                <input type="text" id="search-input" placeholder="학생 이름을 입력하세요" autocomplete="off">
                <button class="btn-search" id="btn-search">검색</button>
            </div>

            <!-- 결과 테이블: 헤더 고정 + 바디 스크롤 -->
            <div class="result-table-wrap">

                <!-- 고정 헤더 -->
                <div class="result-table-head">
                    <table class="result-table">
                        <colgroup>
                            <col style="width: 25%">
                            <col style="width: 35%">
                            <col style="width: 30%">
                            <col style="width: 25%">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>이름</th>
                            <th>현재 AppID</th>
                            <th>이전 AppID</th>
                            <th>저장</th>
                        </tr>
                        </thead>
                    </table>
                </div>

                <!-- 스크롤 바디 -->
                <div class="result-table-body">
                    <table class="result-table">
                        <colgroup>
                            <col style="width: 25%">
                            <col style="width: 35%">
                            <col style="width: 30%">
                            <col style="width: 25%">
                        </colgroup>
                        <tbody id="result-tbody">
                        <tr class="state-row">
                            <td colspan="4">학생 이름을 검색해 주세요.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script src="/js/app_id_temp.js"></script>
</body>
</html>
