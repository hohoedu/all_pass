<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Custom Css / Js -->
  <link rel="stylesheet" th:href="@{/css/style_copy.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">

  <link rel="stylesheet" th:href="@{/css/media.css}">
  <script th:src="@{/js/custom.js}"></script>
  <!-- Html menu Load -->
  <script src="js/loadHTML.js"></script>
  <title>입회 진단 테스트</title>
</head>

<body>
  <div class="main-container">
    <div class="main-frame">
      <!-- left nav bar -->
      <aside id="sidebar-load"></aside>
      <main class="main-info">
        <div class="line-second-frame">
          <!-- section:left -->
          <section class="sup-left">
            <div class="inout-head">
              <div class="common-title">
                <h2>입회 진단 테스트</h2>
              </div>
              <div class="class-btns">
                <div class="common-btn select-del" id="btn-delete" data-type="inout">선택 삭제</div>
                <div class="common-btn consult-add" id="btn-add" data-type="inout">+ 신규 테스트 생성</div>
              </div>
            </div>
            <div class="info-filters">
            </div>
            <div class="mt">
              <div class="table-frame move-t-frame">
                <table class="basic-table yh">
                  <colgroup>
                    <col width="5%">
                    <col width="10%">
                    <col width="15%">
                    <col width="15%">
                    <col width="20%">
                    <col width="20%">
                    <col width="15%">
                  </colgroup>
                  <thead>
                    <tr>
                      <th class="checkbox-group">
                        <input type="checkbox" id="" name="">
                      </th>
                      <th>No</th>
                      <th><img src="image/sort_checked.svg" alt="" class="svg-sort">이름</th>
                      <th><img src="image/sort.svg" alt="" class="svg-sort">단계</th>
                      <th><img src="image/sort.svg" alt="" class="svg-sort">코드</th>
                      <th><img src="image/sort.svg" alt="" class="svg-sort">응시일</th>
                      <th><img src="image/sort.svg" alt="" class="svg-sort">학년</th>
                    </tr>
                  </thead>
                  <div class="table-body">
                    <tbody id="student-tbody" class="stripe">
                      <tr>
                        <td class="checkbox-group">
                          <input type="checkbox" id="" name="">
                        </td>
                        <td>1</td>
                        <td>김호일</td>
                        <td>HL-1</td>
                        <td>AAG35</td>
                        <td>2025-08-30</td>
                        <td>초1</td>
                      </tr>
                      <tr>
                        <td class="checkbox-group">
                          <input type="checkbox" id="" name="">
                        </td>
                        <td>2</td>
                        <td>김호일</td>
                        <td>HL-1</td>
                        <td>AAG35</td>
                        <td>2025-08-30</td>
                        <td>초1</td>
                      </tr>
                      <tr>
                        <td class="checkbox-group">
                          <input type="checkbox" id="" name="">
                        </td>
                        <td>3</td>
                        <td>김호일</td>
                        <td>BL-3</td>
                        <td>AAG35</td>
                        <td>2025-08-30</td>
                        <td>초3</td>
                      </tr>
                      <tr>
                        <td class="checkbox-group">
                          <input type="checkbox" id="" name="">
                        </td>
                        <td>4</td>
                        <td>김호일</td>
                        <td>HL-1</td>
                        <td>AAG35</td>
                        <td>2025-08-30</td>
                        <td>초1</td>
                      </tr>
                    </tbody>
                  </div>
                </table>
              </div>
            </div>
          </section>
          <!-- gray line -->
          <div class="divider"></div>
          <!-- section:right -->
          <section class="sup-right">
            <div class="inout-head">
              <div class="common-title">
                <h2>결과 상세보기</h2>
              </div>
              <div class="inout-btns">
                <div class="common-btn print-btn" id="btn-print" data-type="inout">인쇄</div>
              </div>
            </div><!-- 메뉴 -->
            <div id="level-test"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <!-- modal -->
  <div class="modal consult-modal">
    <div class="modal-scroll">
      <div class="consult-record">
        <!-- 테스트 코드 발급 -->
        <div class="m-t-line" style="margin-bottom: 15px;">
          <div class="title">신규 테스트 생성</div>
          <a href="#" class="btn-close"></a>
        </div>
        <table class="base-info-t">
          <colgroup>
            <col style="width:15%;">
            <col style="width:35%;">
            <col style="width:15%;">
            <col style="width:35%;">
          </colgroup>
          <tbody>
            <tr>
              <th>이름</th>
              <td>
                <input type="text" name="studentName" value="김호호" style="padding-left:10px;">
              </td>
              <th>응시일</th>
              <td class="icon-field day-picker" style="position: relative;">
                <div class="day-display"></div> <!-- 표시 영역 -->
                <div>
                  <input type="date" class="birth-input hidden-picker" />
                  <button type="button" class="icon-btn birth-btn">
                    <img src="image/calendar.png" alt="달력 아이콘" />
                  </button>
                </div>
              </td>
            </tr>
            <tr>
              <th>학년</th>
              <td>
                <div class="select-wrap">
                  <select name="inflowRoute" id="inflow" class="styled-select">
                    <option value="age7">예비초1</option>
                    <option value="grade1">초1</option>
                    <option value="grade2">초2</option>
                    <option value="grade3">초3</option>
                    <option value="grade4">초4</option>
                  </select>
                </div>
              </td>
              <th>단계</th>
              <td>
                <div class="select-wrap">
                  <select name="inflowRoute" id="inflow" class="styled-select">
                    <optgroup label="한자">
                      <option value="HL-1">한자 1학년A (HL-1)</option>
                      <option value="HL-2">한자 1학년B (HL-2)</option>
                      <option value="HL-3">한자 2학년A (HL-3)</option>
                      <option value="HL-4">한자 3학년A (HL-4)</option>
                      <option value="HL-5">한자 4학년A (HL-5)</option>
                    </optgroup>
                    <optgroup label="독서">
                      <option value="BL-1">독서 1학년A (BL-1)</option>
                      <option value="BL-2">독서 1학년B (BL-2)</option>
                      <option value="BL-3">독서 2학년A (BL-3)</option>
                      <option value="BL-4">독서 3학년A (BL-4)</option>
                      <option value="BL-5">독서 4학년A (BL-5)</option>
                    </optgroup>

                  </select>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <div class="save-btn-frame">
          <button class="save-btn">생성</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    function includeHTML() {
      const includeTarget = document.getElementById('level-test');
      const targetFile = 'level-test_h.html';

      if (targetFile && includeTarget) {
        fetch(targetFile) // fetch API를 사용하여 파일 가져오기
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
          })
          .then(html => {
            includeTarget.innerHTML = html;
          })
          .catch(error => {
            console.error('Error fetching include file:', error);
          });
      }
    }
    includeHTML(); // 함수 실행
  </script>
</body>

</html>
