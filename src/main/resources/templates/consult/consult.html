<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <link rel="stylesheet" th:href="@{/css/consult.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/consult.js}" defer></script>
    <title>상담 문의 기록</title>
</head>
<body>
<div class="main-container">
    <div class="main-frame">
        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
        <div class="layout">
            <main class="page">
                <input type="hidden" id="current-user-code" th:value="${session.user.userCode}">

                <header class="page-header">
                    <h1>상담문의 기록</h1>
                    <div class="header-actions">
                        <button class="btn btn-line" id="consult-print">
                            <i class="fa-solid fa-print"></i>인쇄
                        </button>
                        <button class="btn btn-gray" id="consult-excel">
                            <i class="fa-solid fa-file-excel"></i>엑셀 다운로드
                        </button>
                        <button class="btn btn-green" id="consult-add">+ 상담기록 추가</button>
                    </div>
                </header>

                <section class="filter-box">
                    <div class="filter-group">
                        <label>기간 선택</label>
                        <input type="date" id="start-date"/> -
                        <input type="date" id="end-date"/>
                    </div>

                    <div class="filter-group">
                        <label>진행상황</label>
                        <select id="progress-filter">
                            <option value="all">전체</option>
                            <option value="counseling">문의</option>
                            <option value="waiting">대기</option>
                            <option value="confirmed">입회</option>
                            <option value="ended">종료</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>학년</label>
                        <select id="grade-filter">
                            <option value="">전체</option>
                            <th:block th:each="grade : ${grades}">
                                <option th:value="${grade.gradeKey}" th:text="${grade.gradeName}"></option>
                            </th:block>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>문의 과목</label>
                        <select id="subject-filter">
                            <option value="">전체</option>
                            <option value="hoho">호호스쿨</option>
                            <option value="han">한스쿨</option>
                            <option value="book">북스쿨</option>
                            <option value="doc">독서클리닉</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>선생님</label>
                        <select id="teacher-filter">
                            <option value="">전체</option>
                            <th:block th:each="teacher : ${teachers}">
                                <option th:value="${teacher.userCode}"
                                        th:text="${teacher.userName + ' 선생님'}"></option>
                            </th:block>
                            <option th:if="${!isMeInList}" th:value="${session.user.userCode}"
                                    th:text="${session.user.userName + ' 선생님'}"></option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>이름/연락처 조회</label>
                        <input class="search-input" type="text" id="keyword-input"
                               placeholder="학생명 / 연락처 입력"/>
                    </div>

                    <button class="btn btn-purple" id="search-btn">조회</button>
                    <button class="btn btn-line" id="reset-btn">
                        <i class="fa-solid fa-rotate-right"></i>필터 초기화
                    </button>
                    <div class="checkbox-group">
                        <input type="checkbox" name="myConsult" id="myConsult">
                        <label for="myConsult" class="class-label">내가 작성한 상담만 보기</label>
                    </div>
                </section>

                <section class="summary">
                    <div class="summary-card blue">
                        <span>전체</span><strong id="cnt-all">0<em>건</em></strong>
                    </div>
                    <div class="summary-card green">
                        <span>입회</span><strong id="cnt-confirmed">0<em>건</em></strong>
                    </div>
                    <div class="summary-card orange">
                        <span>대기</span><strong id="cnt-waiting">0<em>건</em></strong>
                    </div>
                    <div class="summary-card yellow">
                        <span>문의</span><strong id="cnt-counseling">0<em>건</em></strong>
                    </div>
                    <div class="summary-card gray">
                        <span>종료</span><strong id="cnt-ended">0<em>건</em></strong>
                    </div>
                </section>

                <section class="list-box" id="consult-list-box">
                    <div class="list-head">
                        <div>No</div>
                        <div class="sort-col" data-col="consultDate">
                            등록일 <img class="sort-icon" src="/image/sort.svg">
                        </div>
                        <div class="sort-col" data-col="studentName">
                            학생명/연락처 <img class="sort-icon" src="/image/sort.svg">
                        </div>
                        <div class="sort-col" data-col="gradeName">
                            학년 <img class="sort-icon" src="/image/sort.svg">
                        </div>
                        <div class="sort-col" data-col="consultType">
                            문의 과목 <img class="sort-icon" src="/image/sort.svg">
                        </div>
                        <div class="sort-col" data-col="userName">
                            상담 선생님 <img class="sort-icon" src="/image/sort.svg">
                        </div>
                        <div>메모</div>
                        <div class="sort-col" data-col="progressKey">
                            진행상황 <img class="sort-icon" src="/image/sort.svg">
                        </div>
                        <div>링크 발송일/입회일</div>
                        <div></div>
                    </div>
                </section>
            </main>
        </div>
        <div th:replace="~{consult/consult-modal :: consultModal}"></div>
    </div>
</div>
</body>
</html>
