<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/consult.js}"></script>
    <!-- Html menu Load -->
    <script th:src="@{/js/sidebar.js}"></script>
    <title>상담문의 기록</title>
</head>

<body>
<div class="main-container">
    <div class="main-frame">
        <!-- left nav bar -->
        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
        <main class="main-info">
            <div class="student-frame">
                <!-- section:counsel -->
                <section class="counsel-section">
                    <div class="counsel-inner">
                        <div class="class-header">
                            <div class="common-title">
                                <h2>상담문의 기록</h2>
                            </div>
                            <div class="class-btns">
                                <a th:href="@{/print/print-consult}" class="print">인쇄</a>
                                <div class="common-btn select-del">선택 삭제</div>
                                <div class="common-btn overlap">중복 문의 검색</div>
                                <div class="common-btn consult-add">+ 상담기록 추가</div>
                            </div>
                        </div>
                        <div class="stats-filter counsel-header">
                            <!-- 좌측: 기간 선택 -->
                            <div class="stats-item-left">
                                <div class="radio-group">
                                    <input type="radio" name="period" id="period-1year" value="1y" checked>
                                    <label for="period-1year">1년</label>
                                    <input type="radio" name="period" id="period-6month" value="6m">
                                    <label for="period-6month">6개월</label>
                                    <input type="radio" name="period" id="period-3month" value="3m">
                                    <label for="period-3month">3개월</label>
                                    <input type="radio" name="period" id="period-custom" value="custom">
                                    <label for="period-custom">일자지정</label>
                                </div>

                                <div class="icon-field basic-input cal-adjust" style="margin-bottom: 0;">
                                    <span id="period-display">2024-10 ~ 2025-10</span>
                                    <button id="calendar-btn" class="icon-btn" style="background: transparent;">
                                        <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                                    </button>
                                    <input type="month" id="calendar-input" style="position:absolute; opacity:0; width:0; height:0;">
                                </div>
                            </div>
                            <!-- 우측: 선택 필터 + 버튼 -->
                            <div class="teacher-search">
                                <div class="sl3">
                                    <div class="basic-select" style="flex: 1;">
                                        <select name="stuName" id="stu-name">
                                            <option value="all">이름</option>
                                            <option value="">학교/유치원</option>
                                        </select>
                                    </div>
                                    <div class="search-box" style="flex: 2;">
                                        <input type="text" id="search-name" name="searchName">
                                    </div>
                                </div>
                                <div class="explore common-btn">검색</div>
                            </div>
                        </div>
                        <!-- main-content -->
                        <div class="bt">
                            <div class="table-frame consult-frame">
                                <table class="lesson-log-table consult-table">
                                    <colgroup>
                                        <col width="5%">
                                        <col width="5%">
                                        <col width="10%">
                                        <col width="5%">
                                        <col width="10%">
                                        <col width="5%">
                                        <col width="10%">
                                        <col width="25%">
                                        <col width="10%">
                                        <col width="10%">
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th class="checkbox-group"><input type="checkbox"/></th>
                                        <th>No</th>
                                        <th>일자</th>
                                        <th>이름</th>
                                        <th>학교</th>
                                        <th>학년</th>
                                        <th>연락처</th>
                                        <th>메모사항</th>
                                        <th>진행상황</th>
                                        <th>등록폼 발송/입회일</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="c, stat : ${consults}" th:attr="data-student-id=${c.id}">
                                        <td class="checkbox-group"><input type="checkbox"/></td>
                                        <td th:text="${stat.count}">1</td>
                                        <td th:text="${c.consultDate}">2026-06-10</td>
                                        <td th:text="${c.studentName}">김호일</td>
                                        <td th:text="${c.school}">호호부설유치원</td>
                                        <td th:text="${c.gradeName}">7세</td>
                                        <td th:text="${c.phone}">010-1234-5678</td>

                                        <!-- 메모사항 -->
                                        <td>
                                            <div class="memo-etc text-middle">
            <textarea class="comment-text"
                      placeholder="내용을 입력해주세요."
                      th:text="${c.content}">상담내용</textarea>
                                            </div>
                                        </td>

                                        <!-- 진행상황 -->
                                        <td>
                                            <div class="select-arrow">
                                                <button class="select-status"
                                                        th:data-status="${c.progressKey != null ? c.progressKey : 'counseling'}"
                                                        th:text="${c.progressKey != null ?
                              (c.progressKey == 'waiting' ? '수업대기' :
                              (c.progressKey == 'confirmed' ? '수업확정' :
                              (c.progressKey == 'ended' ? '종료' : '상담진행')))
                              : '상담진행'}">
                                                    상담진행
                                                </button>

                                                <ul class="dropdown-status">
                                                    <li data-status="counseling">상담진행</li>
                                                    <li data-status="waiting">수업대기</li>
                                                    <li data-status="confirmed">수업확정</li>
                                                    <li data-status="ended">종료</li>
                                                </ul>
                                            </div>
                                        </td>

                                        <!-- 등록폼 발송/입회일 -->
                                        <td>
                                            <div class="cell-middle">
                                                <div class="icon-field basic-input" style="width: 150px;"><span>2026-06-25</span>
                                                    <button class="icon-btn" style="background: transparent;"><img
                                                            th:src="@{/image/calendar.png}" alt="달력 아이콘"></button>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
<!-- modal -->
<div th:replace="~{consult/consult-modal :: consultModal}"></div>

<!-- 진행상황 셀렉트 -->
<script>
    document.querySelectorAll('.select-status').forEach(button => {
        button.addEventListener('click', function () {
            const dropdown = this.nextElementSibling;
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        });
    });
    document.querySelectorAll('.dropdown-status li').forEach(item => {
        item.addEventListener('click', function () {
            const selectWrap = this.closest('.select-arrow');
            const button = selectWrap.querySelector('.select-status');
            const status = this.dataset.status;
            const text = this.textContent;

            button.textContent = text;
            button.setAttribute('data-status', status);

            // 닫기
            this.parentElement.style.display = 'none';
        });
    });

</script>
</body>

</html>
