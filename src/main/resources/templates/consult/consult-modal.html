<div class="modal-backdrop" id="consult-modal" th:fragment="consultModal">
    <div class="modal2">
        <button type="button" class="modal-close" id="modal-close-btn">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h2 class="modal-title">상담기록 추가</h2>
        <div class="modal-content2">
            <section class="modal-panel">
                <div class="modal-panel-title">
                    <span class="step-num">1</span>
                    <span>이름 또는 연락처로 기존 상담 이력을 먼저 조회해 주세요.</span>
                </div>
                <div class="modal-search">
                    <input type="text" id="modal-search-input" placeholder="이름/연락처 입력">
                    <button type="button" class="btn btn-purple" id="modal-search-btn">검색</button>
                </div>
                <div id="modal-search-result">
                    <!-- JS 렌더링 -->
                </div>
            </section>

            <section class="modal-panel">
                <div class="modal-panel-title">
                    <span class="step-num">2</span>
                    <span>상담 정보를 입력하고 저장해 주세요.</span>
                </div>
                <div class="modal-form-grid">
                    <div class="modal-field">
                        <label>이름</label>
                        <input type="text" id="modal-student-name">
                    </div>
                    <div class="modal-field">
                        <label>등록일자</label>
                        <input type="date" id="modal-consult-date">
                    </div>
                    <div class="modal-field">
                        <label>학교</label>
                        <input type="text" id="modal-school">
                    </div>
                    <div class="modal-field">
                        <label>학년</label>
                        <select id="modal-grade-key">
                            <option value="">선택</option>
                            <th:block th:each="grade : ${grades}">
                                <option th:value="${grade.gradeKey}"
                                        th:text="${grade.gradeName}"></option>
                            </th:block>
                        </select>
                    </div>
                    <div class="modal-field">
                        <label>연락처</label>
                        <input type="text" id="modal-phone">
                    </div>
                    <div class="modal-field">
                        <label>유입경로</label>
                        <select id="modal-inflow-route">
                            <option value="">선택</option>
                            <th:block th:each="route : ${inflowRoutes}">
                                <option th:value="${route.inflowRouteKey}"
                                        th:text="${route.inflowRouteName}"></option>
                            </th:block>
                        </select>
                    </div>
                    <div class="modal-field full">
                        <label>문의 과목</label>
                        <div class="subject-checks">
                            <label class="subject-chip subject-hoho">
                                <input type="checkbox" id="modal-type-hoho" value="hoho">
                                <span class="check-box"><i class="fa-solid fa-check"></i></span>
                                <span class="label-text">호호서당(스쿨)</span>
                            </label>
                            <label class="subject-chip subject-han">
                                <input type="checkbox" id="modal-type-han" value="han">
                                <span class="check-box"><i class="fa-solid fa-check"></i></span>
                                <span class="label-text">한스쿨</span>
                            </label>
                            <label class="subject-chip subject-book">
                                <input type="checkbox" id="modal-type-book" value="book">
                                <span class="check-box"><i class="fa-solid fa-check"></i></span>
                                <span class="label-text">북스쿨</span>
                            </label>
                            <label class="subject-chip subject-clinic">
                                <input type="checkbox" id="modal-type-clinic" value="clinic">
                                <span class="check-box"><i class="fa-solid fa-check"></i></span>
                                <span class="label-text">독서클리닉</span>
                            </label>
                        </div>
                    </div>
                    <div class="modal-field full">
                        <label>메모사항</label>
                        <textarea id="modal-content"></textarea>
                    </div>
                </div>
            </section>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-line" id="modal-reset-btn">작성 초기화</button>
            <button type="button" class="btn btn-purple" id="modal-save-btn">저장</button>
        </div>
    </div>
</div>
