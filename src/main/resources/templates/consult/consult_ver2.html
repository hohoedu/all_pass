<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <link rel="stylesheet" th:href="@{/css/consult_ver2.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/consult.js}" defer></script>
    <title>상담 문의 기록</title>
</head>
<body>
<div class="main-container">
    <div class="main-frame">
        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
        <div class="layout">
            <main class="page">
                <input type="hidden" id="current-user-code" th:value="${session.user.userCode}">

                <header class="page-header">
                    <h1>상담문의 기록</h1>
                    <div class="header-actions">
                        <button class="btn btn-line" id="consult-print">
                            <i class="fa-solid fa-print"></i>인쇄
                        </button>
                        <button class="btn btn-gray" id="consult-excel">
                            <i class="fa-solid fa-file-excel"></i>엑셀 다운로드
                        </button>
                        <button class="btn btn-green" id="consult-add">+ 상담기록 추가</button>
                    </div>
                </header>

                <section class="filter-box">
                    <div class="filter-group">
                        <label>조회 기간</label>
                        <div class="period-radio-group">
                            <label class="period-radio">
                                <input type="radio" name="period" value="1month" checked>
                                <span>1개월</span>
                            </label>
                            <label class="period-radio">
                                <input type="radio" name="period" value="3month">
                                <span>3개월</span>
                            </label>
                            <label class="period-radio">
                                <input type="radio" name="period" value="6month">
                                <span>6개월</span>
                            </label>
                            <label class="period-radio">
                                <input type="radio" name="period" value="custom">
                                <span>기간 지정</span>
                            </label>
                        </div>
                    </div>

                    <div class="filter-group">
                        <input type="date" id="start-date"/> -
                        <input type="date" id="end-date"/>
                    </div>

                    <div class="filter-group">
                        <label>진행상황</label>
                        <select id="progress-filter">
                            <option value="all">전체</option>
                            <option value="counseling">문의</option>
                            <option value="waiting">대기</option>
                            <option value="confirmed">입회</option>
                            <option value="ended">종료</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <input class="search-input" type="text" id="keyword-input"
                               placeholder="학생명 / 연락처 입력"/>
                    </div>

                    <button class="btn btn-purple" id="search-btn">조회</button>
                    <button class="btn btn-line" id="reset-btn">
                        <i class="fa-solid fa-rotate-right"></i>필터 초기화
                    </button>
                </section>

                <section class="summary">
                    <div class="summary-card blue">
                        <span>전체</span><strong id="cnt-all">0<em>건</em></strong>
                    </div>
                    <div class="summary-card green">
                        <span>입회</span><strong id="cnt-confirmed">0<em>건</em></strong>
                    </div>
                    <div class="summary-card orange">
                        <span>대기</span><strong id="cnt-waiting">0<em>건</em></strong>
                    </div>
                    <div class="summary-card yellow">
                        <span>문의</span><strong id="cnt-counseling">0<em>건</em></strong>
                    </div>
                    <div class="summary-card gray">
                        <span>종료</span><strong id="cnt-ended">0<em>건</em></strong>
                    </div>
                </section>

                <section class="list-box" id="consult-list-box">
                    <div class="list-head">
                        <div>No</div>
                        <div>등록일</div>
                        <div>학생명/연락처</div>
                        <div>학년</div>
                        <div>문의 과목</div>
                        <div>상담 선생님</div>
                        <div>메모</div>
                        <div>진행상황</div>
                        <div>링크 발송일/입회일</div>
                        <div></div>
                    </div>
                </section>
            </main>
        </div>

        <div class="modal-backdrop" id="consult-modal">
            <div class="modal2">
                <button type="button" class="modal-close" id="modal-close-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <h2 class="modal-title">상담기록 추가</h2>
                <div class="modal-content2">
                    <section class="modal-panel">
                        <div class="modal-panel-title">
                            <span class="step-num">1</span>
                            <span>이름 또는 연락처로 기존 상담 이력을 먼저 조회해 주세요.</span>
                        </div>
                        <div class="modal-search">
                            <input type="text" id="modal-search-input" placeholder="이름/연락처 입력">
                            <button type="button" class="btn btn-purple" id="modal-search-btn">검색</button>
                        </div>
                        <div id="modal-search-result">
                            <!-- JS 렌더링 -->
                        </div>
                    </section>

                    <section class="modal-panel">
                        <div class="modal-panel-title">
                            <span class="step-num">2</span>
                            <span>상담 정보를 입력하고 저장해 주세요.</span>
                        </div>
                        <div class="modal-form-grid">
                            <div class="modal-field">
                                <label>이름</label>
                                <input type="text" id="modal-student-name">
                            </div>
                            <div class="modal-field">
                                <label>등록일자</label>
                                <input type="date" id="modal-consult-date">
                            </div>
                            <div class="modal-field">
                                <label>학교</label>
                                <input type="text" id="modal-school">
                            </div>
                            <div class="modal-field">
                                <label>학년</label>
                                <select id="modal-grade-key">
                                    <option value="">선택</option>
                                    <th:block th:each="grade : ${grades}">
                                        <option th:value="${grade.gradeKey}"
                                                th:text="${grade.gradeName}"></option>
                                    </th:block>
                                </select>
                            </div>
                            <div class="modal-field">
                                <label>연락처</label>
                                <input type="text" id="modal-phone">
                            </div>
                            <div class="modal-field">
                                <label>유입경로</label>
                                <select id="modal-inflow-route">
                                    <option value="">선택</option>
                                    <th:block th:each="route : ${inflowRoutes}">
                                        <option th:value="${route.inflowRouteKey}"
                                                th:text="${route.inflowRouteName}"></option>
                                    </th:block>
                                </select>
                            </div>
                            <div class="modal-field full">
                                <label>문의 과목</label>
                                <div class="subject-checks">
                                    <label class="subject-chip subject-hoho">
                                        <input type="checkbox" id="modal-type-hoho" value="hoho">
                                        <span class="check-box"><i class="fa-solid fa-check"></i></span>
                                        <span class="label-text">호호서당(스쿨)</span>
                                    </label>
                                    <label class="subject-chip subject-han">
                                        <input type="checkbox" id="modal-type-han" value="han">
                                        <span class="check-box"><i class="fa-solid fa-check"></i></span>
                                        <span class="label-text">한스쿨</span>
                                    </label>
                                    <label class="subject-chip subject-book">
                                        <input type="checkbox" id="modal-type-book" value="book">
                                        <span class="check-box"><i class="fa-solid fa-check"></i></span>
                                        <span class="label-text">북스쿨</span>
                                    </label>
                                    <label class="subject-chip subject-clinic">
                                        <input type="checkbox" id="modal-type-clinic" value="clinic">
                                        <span class="check-box"><i class="fa-solid fa-check"></i></span>
                                        <span class="label-text">독서클리닉</span>
                                    </label>
                                </div>
                            </div>
                            <div class="modal-field full">
                                <label>메모사항</label>
                                <textarea id="modal-content"></textarea>
                            </div>
                        </div>
                    </section>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-line" id="modal-reset-btn">작성 초기화</button>
                    <button type="button" class="btn btn-purple" id="modal-save-btn">저장</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
