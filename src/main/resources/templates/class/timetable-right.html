<section class="student-pick-right" th:fragment="studentPickRight">
    <div class="table-frame" style="border-top: none;">
        <input type="hidden" id="timeTableKey" th:value="${timetableKey}"/>
        <!-- 요일 버튼 -->
        <div class="time-tab-menu">
            <button class="time-tab-btn" th:each="day, dtStat : ${days}"
                    th:attr="data-tab=${day.id}"
                    th:text="${day.label}"></button>
        </div>
        <div class="table-frame time-table-frame bt">
            <div class="time-tab-content" th:each="day, dtStat : ${days}" th:id="${day.id}">

                <table class="basic-table time-table stripe">
                    <colgroup>
                        <col width="8%">
                        <col width="8%">
                        <col width="15%">
                        <col width="20%">
                        <col width="50%">
                        <col width="5%">
                    </colgroup>
                    <thead>
                    <tr>
                        <th></th>
                        <th>교시</th>
                        <th>시간</th>
                        <th>과목</th>
                        <th>학생</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody th:attr="id='timeTableBody_' + ${day.id}"
                           class="time-table-body"
                           th:with="dayMap=${tableMap.get(day.id)}">
                    <tr class="time-row"
                        th:each="i : ${#numbers.sequence(1,6)}"
                        th:with="entry=${dayMap != null ? dayMap[i + ''] : null}"
                        th:data-time-table-key="${entry != null ? entry.timeTableKey : ''}"
                        th:data-time-table-code="${entry != null ? entry.timeTableKey : ''}"
                        th:attr="data-day=${day.id}, data-period-no=${i}">
                        <input type="hidden" id="comclassInfos" th:value="${comclassInfosJson}">
                        <td class="radio-group round">
                            <input type="radio"
                                   th:attr="name=${'selectedPeriod_' + day.id}"
                                   th:checked="${i == 1}"/>
                        </td>

                        <td th:text="${i}">1</td>

                        <td>
                            <div class="time-boxes">
                                <div class="time-start">
                                    시작
                                    <input type="text" class="time_input start-time"
                                           th:value="${entry != null ? entry.startTime : ''}"
                                           placeholder="00:00"
                                           pattern="^([01]\\d|2[0-3]):[0-5]\\d$"
                                           inputmode="numeric" maxlength="5"
                                           title="시간은 24시간 기준으로 입력하세요"/>
                                </div>
                                <div class="time-end">
                                    종료
                                    <input type="text" class="time_input end-time"
                                           th:value="${entry != null ? entry.endTime : ''}"
                                           placeholder="00:00"
                                           pattern="^([01]\\d|2[0-3]):[0-5]\\d$"
                                           inputmode="numeric" maxlength="5"
                                           title="시간은 24시간 기준으로 입력하세요"/>
                                </div>
                            </div>
                        </td>

                        <td>
                            <input type="hidden" id="tableUserCode" th:value="${userCode}"/>
                            <!-- class: value/selected 모두 Key로 통일 -->
                            <div class="basic-select square size-160">
                                <select name="classKey" class="class-select">
                                    <option value="">선택 안함</option>
                                    <option th:each="cc : ${classCodes}"
                                            th:value="${cc.classKey}"
                                            th:text="${cc.className}"
                                            th:selected="${entry != null and cc.classKey == entry.classKey}">
                                    </option>
                                </select>
                            </div>

                            <div class="mini-select size-160">
                                <div class="basic-select square">
                                    <select name="unitKey" class="unit-select"
                                            th:attr="data-selected=${entry != null ? entry.unitKey : ''}">
                                        <option value=''>선택 안함</option>

                                    </select>
                                </div>
                                <input type="hidden" id="classUnits" th:value="${classUnits}"/>
                                <input type="hidden" id="classCodes" th:value="${classCodesJson}"/>
                                <div class="basic-select square">
                                    <select name="gradeKey">
                                        <option value="">선택 안함</option>
                                        <option th:each="g : ${grades}"
                                                th:value="${g.gradeKey}"
                                                th:text="${g.gradeName}"
                                                th:selected="${entry != null and g.gradeKey == entry.gradeKey}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </td>

                        <td>
                            <th:block th:if="${entry != null}">
                                <div th:each="stu : ${entry.students}"
                                     class="student-badge comclass-badge-name"
                                     th:attr="data-name=${stu.studentName},
                                     data-student-id=${stu.studentId},
                                     data-time-table-key=${entry.timeTableKey}">
                                    <span class="badge-name" th:text="${stu.studentName}"></span>

                                    <!-- week 문자열 방어 -->
                                    <span class="count-num"
                                          th:if="${stu.week != null and T(java.lang.Integer).parseInt(stu.week) <= 3}"
                                          th:text="'(' + ${stu.week} + ')'"></span>
                                    <span id="assign_delete"
                                          class="badge-close"
                                          th:data-student-id="${stu.studentId}"
                                          th:data-time-table-key="${entry.timeTableKey}"
                                          title="삭제"></span>
                                </div>
                            </th:block>
                        </td>
                        <td>
                            <div class="time_table_row">
                                <th:block th:if="${entry != null and entry.timeTableKey != null}">
                                    <img th:src="@{/image/trash.svg}" alt="삭제" class="badge-init" title="삭제">
                                </th:block>
                                <th:block th:if="${entry != null and entry.classKey == 'COM'}">
                                    <img th:src="@{/image/pen.svg}" alt="일괄 등록" class="add-class" title="일괄 등록">
                                </th:block>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const dayMap = {0: "sun", 1: "mon", 2: "tue", 3: "wed", 4: "thu", 5: "fri", 6: "sat"};
            const savedDay = localStorage.getItem("selectedDay");
            const today = new Date();
            const defaultDay = dayMap[today.getDay()] || "mon";
            const targetId = savedDay || defaultDay;

            // 모든 버튼/콘텐츠에서 active 제거
            document.querySelectorAll(".time-tab-btn").forEach(btn => btn.classList.remove("active"));
            document.querySelectorAll(".time-tab-content").forEach(ct => ct.classList.remove("active"));

            // 해당 요일 버튼/콘텐츠에 active 추가
            const targetBtn = document.querySelector(`.time-tab-btn[data-tab="${targetId}"]`);
            const targetContent = document.getElementById(targetId);

            if (targetBtn) targetBtn.classList.add("active");
            if (targetContent) targetContent.classList.add("active");

            // 클릭 시 localStorage에 저장
            document.querySelectorAll(".time-tab-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    localStorage.setItem("selectedDay", btn.dataset.tab);
                });
            });
        });
    </script>

</section>
