<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/class/record.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <title>수업 일지</title>
</head>

<body>
<div class="main-container">
    <div class="main-frame">
        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
        <main class="main-info bf-main">
            <div class="student-frame class-info-frame">
                <section class="class-info-section">
                    <div class="class-desc">
                        <div class="class-header">
                            <div class="common-title">
                                <h2>수업 일지</h2>
                            </div>
                            <div class="class-btns">
                                <div class="common-btn class-all-guide">수업 안내 일괄 발송</div>
                                <div class="common-btn class-guide">수업 안내 발송</div>
                                <div class="common-btn class-comment">수업 후 코멘트 발송</div>
                                <div class="common-btn record-save class-save">저장</div>
                            </div>
                        </div>

                        <!-- 수업 후 알림 미발송 상태바 -->
                        <div id="unsent-alert-bar"
                             th:style="${unsentStudentIds != null and !unsentStudentIds.isEmpty()} ? 'display:flex;' : 'display:none;'"
                             style="background:#fff3cd; border:1px solid #ffc107; border-radius:4px; padding:10px 15px; margin-top:10px; align-items:center; gap:8px;">
                            <span style="color:#856404; font-weight:bold;">⚠ 수업 후 알림 미발송</span>
                            <span id="unsent-alert-text" style="color:#856404;"
                                  th:text="${unsentStudentIds != null and !unsentStudentIds.isEmpty()}
                                  ? ${unsentStudentIds.size() + '명의 학생에게 수업 후 알림이 발송되지 않았습니다.'}
                                  : ''">
                            </span>
                        </div>

                        <div class="month-header">
                            <div class="month-title">
                                <span class="current-month" id="record_current"></span>
                                <div style="position: relative;">
                                    <input type="date" id="record_calendar" class="hidden-date"/>
                                    <button type="button" class="icon-btn calendar-open">
                                        <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                                    </button>
                                </div>
                            </div>
                            <div class="basic-select">
                                <select name="teacher" id="teacher-select" style="width: 200px;">
                                    <th:block th:each="u : ${users}">
                                        <option th:value="${u.userCode}"
                                                th:text="${u.userName + ' 선생님'}"
                                                th:selected="${u.userCode == user.userCode}">
                                        </option>
                                    </th:block>
                                </select>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="second-frame">
                    <section class="class-log-left">
                        <h4>클래스 선택</h4>
                        <div class="week-selector" style="display: none">
                            <th:block th:each="i : ${#numbers.sequence(1, 4)}">
                                <button class="week-btn"
                                        th:classappend="${activeWeek == 'ju_' + i} ? 'active' : ''"
                                        th:data-week="'ju_' + ${i}"
                                        th:text="${i} + '주'">
                                </button>
                            </th:block>
                        </div>
                        <ul class="class-list" id="record-class-list">
                            <li th:each="s, iterStat : ${labels}"
                                th:class="'class-btn' + (${iterStat.index} == 0 ? ' active' : '')"
                                th:data-class-id="${s.timeTableKey}"
                                th:data-time-table-key="${s.timeTableKey}"
                                th:data-unit-key="${s.unitKey}"
                                th:data-class-key="${s.classKey}">
                                <span th:text="${s.classLabel}"></span>
                            </li>
                        </ul>
                    </section>

                    <section class="class-log-right">
                        <div class="bt">
                            <div class="table-frame lesson-frame">
                                <table class="lesson-log-table">
                                    <colgroup>
                                        <col width="3%">
                                        <col width="3%">
                                        <col width="7%">
                                        <col width="15%">
                                        <col width="10%">
                                        <col width="7%">
                                        <col width="17%">
                                        <col width="17%">
                                        <col width="16%">
                                        <col width="5%">
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th class="checkbox-group">
                                            <input type="checkbox" id="select-all-students"/>
                                        </th>
                                        <th>No</th>
                                        <th>이름</th>
                                        <th>출결</th>
                                        <th>보강일자</th>
                                        <th>특이사항</th>
                                        <th>상담기록</th>
                                        <th>수업지도 <span class="mini-badge">앱발송</span></th>
                                        <th>선생님의 코멘트 <span class="mini-badge">앱발송</span></th>
                                        <th>발송여부</th>
                                    </tr>
                                    </thead>
                                    <tbody id="record_tbody">
                                    <tr th:each="s, stat : ${students}"
                                        th:data-student-id="${s.studentId}"
                                        th:data-app-token="${s.appToken}"
                                        th:data-center-code="${s.centerCode}"
                                        th:data-after-class-key="${afterClass != null and afterClass.size() > stat.index ? afterClass[stat.index].afterClassKey : ''}">
                                        <td class="checkbox-group">
                                            <input type="checkbox"/>
                                        </td>
                                        <td th:text="${stat.count}"></td>
                                        <td class="studentName" th:text="${s.studentName}"></td>
                                        <td>
                                            <div>
                                                <span th:classappend="
                                                    ${s.attendanceName == '출석 완료'} ? 'status-badge attend stbox' :
                                                    (${s.attendanceName == '지각'} ? 'status-badge late stbox' :
                                                    (${s.attendanceName == '수업 전'} ? 'status-badge before stbox' :
                                                    'status-badge absent stbox'))"
                                                      th:text="${s.attendanceName}">
                                                </span>
                                                <div class="time in stbox">
                                                    등원
                                                    <span class="time-set">
                                                        <span class="display-time"
                                                              th:text="${s.inTime != null ? s.inTime : '--:--'}"></span>
                                                        <input type="time" class="timepicker" th:value="${s.inTime}"/>
                                                    </span>
                                                </div>
                                                <div class="time out stbox">
                                                    하원
                                                    <span class="time-set">
                                                        <span class="display-time"
                                                              th:text="${s.outTime != null ? s.outTime : '--:--'}"></span>
                                                        <input type="time" class="timepicker" th:value="${s.outTime}"/>
                                                    </span>
                                                </div>
                                            </div>
                                        </td>
                                        <td th:if="${s.remedialDate == null}">--</td>
                                        <td th:if="${s.remedialDate != null}">
                                            <div class="icon-field time-input cal-adjust"
                                                 style="margin-bottom: 0; text-align: center;">
                                                <span class="selected-datetime"
                                                      th:text="${s.remedialDate == '9999-12-31' ? '날짜를 선택하세요' : s.remedialDate}">
                                                </span>
                                                <input type="date" class="datetime-input hidden-picker"
                                                       th:value="${s.remedialDate == '9999-12-31' ? '' : s.remedialDate}"/>
                                                <button type="button" class="icon-btn calendar-btn"
                                                        style="background: transparent;">
                                                    <img th:src="@{/image/calendar.png}" alt="달력 아이콘"/>
                                                </button>
                                            </div>
                                        </td>
                                        <td>
                                            <ul class="tag-list">
                                                <div class="remarks">
                                                    <img th:src="@{/image/add.png}" alt="">
                                                </div>
                                            </ul>
                                        </td>
                                        <td class="cell-middle">
                                            <div class="counsel-box">
                                                <div class="counsel-type">
                                                    <button>전화</button>
                                                    <button>문자</button>
                                                    <button>대면</button>
                                                </div>
                                                <textarea placeholder="내용을 입력해주세요."></textarea>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="cell-middle">
                                                <div class="after-comment">
                                                    <textarea class="comment-text record-content"
                                                              placeholder="내용을 입력해주세요."
                                                              th:text="${afterClass != null and afterClass.size() > stat.index and afterClass[stat.index].content != null
                                                                  ? #strings.replace(#strings.replace(#strings.replace(afterClass[stat.index].content, '<br />', ''),'<br/>',''),'<br>','')
                                                                  : ''}"
                                                              th:data-original-content="${afterClass != null and afterClass.size() > stat.index ? afterClass[stat.index].content : ''}">
                                                    </textarea>
                                                    <input type="hidden" class="record-word"
                                                           th:value="${afterClass != null and afterClass.size() > stat.index ? afterClass[stat.index].homework : ''}">
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="cell-middle">
                                                <div class="after-comment">
                                                    <textarea class="comment-text record-review"
                                                              placeholder="선생님의 코멘트를 입력해주세요."
                                                              th:text="${afterClass != null and afterClass.size() > stat.index and afterClass[stat.index].review != null
                                                                  ? #strings.replace(#strings.replace(#strings.replace(afterClass[stat.index].review, '<br />', ''), '<br/>',''), '<br>','')
                                                                  : ''}">
                                                    </textarea>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="send-ornot">
                                            <img th:if="${s.appToken == null or s.appToken == ''}"
                                                 src="/image/no-smartphones.png" alt="">
                                            <span th:if="${s.appToken != null and s.appToken != ''}">
                                                <img th:src="${s.isBeforeSend == '1' ? '/image/send2.png' : '/image/send1.png'}" alt="">
                                                <img th:src="${s.isAfterSend == '1' ? '/image/send3.png' : '/image/send1.png'}" alt="">
                                            </span>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(students)}">
                                        <td colspan="10" style="text-align: center; padding: 20px;">
                                            등록된 학생이 없습니다.
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- 특이사항 modal -->
<div class="modal remarks-modal">
    <div class="remark">
        <div class="remarks-frame">
            <div class="m-t-line">
                <div>
                    <div class="title">특이사항</div>
                </div>
                <a href="#" class="btn-close"></a>
            </div>
            <p class="remark-sub">학생의 해당 수업에 대한 특이사항이나 문제점을 체크해 주세요.</p>
            <div class="table-frame remarks-tframe bt">
                <table class="basic-table remarks-table">
                    <colgroup>
                        <col width="30%">
                        <col width="70%">
                    </colgroup>
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="save-btn-frame" style="margin-top: 20px;">
                <button type="submit" class="save-btn">저장</button>
            </div>
        </div>
    </div>
</div>

<!-- 수업 안내 발송 modal -->
<div class="modal class-guide-modal">
    <div class="guidance">
        <div class="guide-frame">
            <div class="m-t-line">
                <div>
                    <div class="title">수업 안내 발송</div>
                </div>
                <a href="#" class="btn-close"></a>
            </div>
            <p class="remark-sub">아래의 수업 안내 내용이 앱으로 발송됩니다.</p>
            <div class="bt">
                <div class="table-frame remarks-tframe">
                    <table class="basic-table remarks-table">
                        <colgroup>
                            <col width="30%">
                            <col width="70%">
                        </colgroup>
                        <thead></thead>
                        <tbody>
                        <tr>
                            <td>수업 일자</td>
                            <td><p id="record-date"></p></td>
                        </tr>
                        <tr>
                            <td>수업 선생님</td>
                            <td><p id="record-teacher"></p></td>
                        </tr>
                        <tr>
                            <td>선택 학생</td>
                            <td><p id="record-students"></p></td>
                        </tr>
                        <tr>
                            <td>발송 내용</td>
                            <td><p id="record-content" style="line-height: 1.3rem;"></p></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="save-btn-frame" style="margin-top: 40px;">
                <button type="submit" class="save-btn" id="send-before-record">발송</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
