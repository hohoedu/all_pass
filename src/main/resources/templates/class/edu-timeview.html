<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/class/edu-timeview.js}"></script>
    <title>시간표(교) 조회</title>
</head>

<body>
    <div class="main-container" style="height: auto;">
        <div class="main-frame">
            <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
            <main class="main-info timeview">
                <div class="line-second-frame">
                    <section class="time-table-index">
                        <div class="manager-list-frame">
                            <div class="top-flex">
                                <div class="common-title">
                                    <h2>시간표 조회(교)</h2>
                                </div>
                                <a class="print" onclick="printEduTimetable()" style="cursor:pointer;">인쇄</a>
                            </div>
                            <div class="month-header">
                                <div class="month-title">
                                    <input type="month" id="monthPicker" th:value="${currentYy + '-' + currentMm}">
                                </div>
                                <div class="basic-select">
                                    <select id="teacher-select" style="width: 200px;">
                                        <option value="">선생님 선택</option>
                                        <option th:each="u : ${users}" th:value="${u.userCode}" th:text="${u.userName}">
                                        </option>
                                    </select>
                                </div>
                                <button type="button" onclick="handleSearch()">조회</button>
                            </div>

                            <table class="timetable-lookup-table" id="edu-timetable">
                                <thead>
                                    <tr>
                                        <th>교시</th>
                                        <th>월</th>
                                        <th>화</th>
                                        <th>수</th>
                                        <th>목</th>
                                        <th>금</th>
                                        <th>토</th>
                                    </tr>
                                </thead>
                                <tbody id="edu-timetable-body">
                                    <tr>
                                        <td colspan="7" style="text-align:center; color:#999; padding:40px;">
                                            선생님과 수강월을 선택 후 조회해주세요.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <!-- 재생성/보기 모달 -->
    <div id="eduConfirmModal" style="display:none;">
        <div class="modal-box">
            <h3>이미 생성된 수업 정보가 있습니다</h3>
            <p>재생성하거나 기존 데이터를 조회할 수 있습니다.</p>
            <div class="modal-footer">
                <button type="button" onclick="closeEduConfirmModal()">취소</button>
                <button type="button" id="viewBtn" onclick="handleView()">보기</button>
                <button type="button" id="regenBtn" onclick="handleRegenerate()">재생성</button>
            </div>
        </div>
    </div>

</body>

</html>
