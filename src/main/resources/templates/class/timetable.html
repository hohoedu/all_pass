<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/class.js}"></script>
    <script th:src="@{/js/class/timetable.js}"></script>
    <!-- Html menu Load -->
    <script th:src="@{/js/sidebar.js}"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/index.js"></script>
    <title>시간표 등록</title>
</head>

<body>
<div class="main-container">
    <!-- header -->
    <div class="main-frame">
        <!-- left nav bar -->
        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
        <main class="main-info">
            <div class="student-frame time-regist-frame">
                <!-- section:top -->
                <section>
                    <div class="class-desc">
                        <div class="class-header">
                            <div class="common-title">
                                <h2>시간표 등록</h2>
                            </div>
                            <div class="class-btns">
                                <div class="common-btn reset-btn">전체 초기화</div>
                                <div class="common-btn last-data" id="load-last-time-table">전월 데이터 불러오기</div>
                                <div class="common-btn record-save" id="table_register">저장</div>
                            </div>
                        </div>
                        <div class="month-header2" style="padding: 10px 0;">
                            <div class="month-title2">
                                <span class="current-month" id="currentMonth"></span>
                                <div class="calendar-wrapper">
                                    <input type="month" id="monthPickerInput" class="hidden-date"/>
                                    <button type="button" class="icon-btn calendar-open" id="openMonthPicker">
                                        <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <!-- section:bottom -->
                <div class="second-frame" style="padding: 0 15px;">
                    <section class="student-pick-left">
                        <div class="student-content">
                            <h4>학생 선택</h4>
                            <div class="add-inform">
                                <p>선택한 학생을 <span id="current-selected-class"></span><br>클래스에 추가합니다.</p>
                                <button class="add-btn" id="add_student_timetable">
                                    추가
                                </button>
                            </div>
                            <div class="mt">
                                <div class="table-frame stu-chocie-frame">
                                    <table class="basic-table stu-chocie-table stripe">
                                        <thead>
                                        <tr>
                                            <th>
                                            </th>
                                            <th><img th:src="@{/image/sort_checked.svg}" alt="" class="svg-sort">이름</th>
                                            <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">학년</th>
                                            <th>수업 주차 선택</th>
                                        </tr>
                                        </thead>
                                        <tbody id="" class="stripe">
                                        <colgroup>
                                            <col width="15%">
                                            <col width="30%">
                                            <col width="15%">
                                            <col width="40%">
                                        </colgroup>
                                        <tr th:each="s, stat : ${students}" class="timetable-pending-list">
                                            <td class="checkbox-group">
                                                <input type="checkbox" th:value="${s.studentId}">
                                            </td>
                                            <td class="stu-badge">
                                                <span class="names" th:text="${s.studentName}"></span>
                                                <span class="badge-han"
                                                      th:classappend="${s.classType == null or s.classType == '2'} ? '' : 'gray' ">
                                한
                            </span>
                                                <span class="badge-book"
                                                      th:classappend="${s.classType == null or s.classType == '1'} ? '' :  'gray' ">
                                독
                            </span>
                                            </td>
                                            <td th:text="${s.gradeName}">초1</td>
                                            <td>
                                                <div class="tab-radio">
                                                    <input type="radio" th:id="${'1-week-' + stat.index}" th:name="${'weeks-' + stat.index}"
                                                           value="1"/>
                                                    <label th:for="${'1-week-' + stat.index}">1주</label>
                                                    <input type="radio" th:id="${'2-week-' + stat.index}" th:name="${'weeks-' + stat.index}"
                                                           value="2"/>
                                                    <label th:for="${'2-week-' + stat.index}">2주</label>
                                                    <input type="radio" th:id="${'3-week-' + stat.index}" th:name="${'weeks-' + stat.index}"
                                                           value="3"/>
                                                    <label th:for="${'3-week-' + stat.index}">3주</label>
                                                    <input type="radio" th:id="${'4-week-' + stat.index}" th:name="${'weeks-' + stat.index}"
                                                           value="4" checked/>
                                                    <label th:for="${'4-week-' + stat.index}">4주</label>
                                                </div>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </section>
                    <div th:replace="~{class/timetable-right :: studentPickRight} "></div>
                    <!-- 📦 종합반 일괄 등록 모달 -->
                    <div th:fragment="comclassModal"
                         id="comclassModal"
                         class="comclass-overlay"
                         style="display:none;">
                        <div class="comclass-window">
                            <div class="comclass-header">
                                <h3>종합반 일괄 등록</h3>
                                <button type="button" class="comclass-close">&times;</button>
                            </div>

                            <div class="comclass-body">
                                <table class="basic-table comclass stripe comclass-table">
                                    <colgroup>
                                        <col width="8%">
                                        <col width="20%">
                                        <col width="15%">
                                        <col width="28%">
                                        <col width="29%">
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th>No</th>
                                        <th>이름</th>
                                        <th>학년</th>
                                        <th>수업</th>
                                        <th>진도</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <!-- 학생 데이터 렌더링 -->
                                    <!--                    <tr th:each="stu, idx : ${students}">-->
                                    <!--                        <td th:text="${idx.index + 1}">1</td>-->
                                    <!--                        <td th:text="${stu.name}">홍길동</td>-->
                                    <!--                        <td th:text="${stu.gradeName}">3학년</td>-->
                                    <tr>
                                        <td>1</td>
                                        <td>홍길동</td>
                                        <td>3학년</td>
                                        <!-- 수업 선택 -->
                                        <td>
                                            <div class="basic-select square size-100">

                                                <select name="classKey" class="comclass-select">
                                                    <option th:value=NULL>선택</option>
                                                    <option th:each="cc : ${classCodes}"
                                                            th:value="${cc.classKey}"
                                                            th:text="${cc.className}"
                                                            th:selected="${entry != null and cc.classKey == entry.classKey}">
                                                    </option>
                                                </select>
                                            </div>
                                        </td>

                                        <td>
                                            <div class="basic-select square size-50">
                                                <select name="unitKey" class="comclass-select"
                                                        th:attr="data-selected=${entry != null ? entry.unitKey : ''}">
                                                    <option value="">선택</option>
                                                </select>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="comclass-footer">
                                <button type="button" id="comclass-save-btn" class="common-btn record-save">저장</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>

</html>
