<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Custom Css / Js -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/media.css}">
  <script th:src="@{/js/custom.js}"></script>
  <script th:src="@{/js/class.js}"></script>
  <!-- Html menu Load -->
  <script th:src="@{/js/sidebar.js}"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/index.js"></script>
  <title>시간표 등록</title>
</head>

<body>
  <div class="main-container">
    <div class="main-frame">
      <!-- left nav bar -->
      <div class="sidebar-load" th:replace="~{sidebar :: sidebar}"></div>
      <main class="main-info">
        <div class="student-frame time-regist-frame">
          <!-- section:top -->
          <section>
            <div class="class-desc">
              <div class="class-header">
                <div class="common-title">
                  <h2>시간표 등록</h2>
                </div>
                <div class="class-btns">
                  <div class="common-btn reset-btn">전체 초기화</div>
                  <div class="common-btn last-data">전월 데이터 불러오기</div>
                  <div class="common-btn record-save" id="table_register">저장</div>
                </div>
              </div>
              <div class="month-header2">
                <div class="month-title2">
                  <span class="current-month" id="currentMonth"></span>
                  <input type="month" id="monthPickerInput" style="position:absolute; opacity:0; width:0; height:0;">
                  <!-- 달력 버튼 -->
                  <div style="position: relative;">

                    <button type="button" class="icon-btn calendar-open" id="openMonthPicker">
                      <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                    </button>
                  </div>
                </div>

              </div>
            </div>
          </section>
          <!-- section:bottom -->
          <div class="second-frame">
            <section class="student-pick-left">
              <div class="student-content">
                <h4>학생 선택</h4>
                <div class="add-inform">
                  <p>선택한 학생을 <span id="current-selected-class"></span><br>클래스에 추가합니다.</p>
                  <button class="add-btn" id="add_student_timetable">
                    추가
                  </button>
                </div>
                <div class="bt">
                  <div class="table-frame stu-chocie-frame">
                    <table class="basic-table stu-chocie-table stripe">
                      <thead>
                        <tr>
                          <th>
                            <div class="checkbox-group">
                              <input type="checkbox">
                            </div>
                          </th>
                          <th><img th:src="@{/image/sort_checked.svg}" alt="" class="svg-sort">이름</th>
                          <th><img th:src="@{/image/sort.svg}" alt="" class="svg-sort">학년</th>
                          <th>수업 주차 선택</th>
                        </tr>
                      </thead>
                      <tbody id="" class="stripe">
                        <colgroup>
                          <col width="15%">
                          <col width="15%">
                          <col width="20%">
                          <col width="50%">
                        </colgroup>
                        <!-- tr 1번째 줄 -->
                        <tr th:each="s, stat : ${students}" class="timetable-pending-list">
                          <td class="checkbox-group">
                            <input type="checkbox" th:value="${s.studentNo}">
                          </td>
                          <td th:text="${s.studentName}">김호일</td>
                          <td th:text="${s.grade}">초1</td>
                          <td>
                            <div class="tab-radio">
                              <input type="radio" th:id="${'1-week-' + stat.index}" th:name="${'weeks-' + stat.index}"
                                value="1" />
                              <label th:for="${'1-week-' + stat.index}">1주</label>
                              <input type="radio" th:id="${'2-week-' + stat.index}" th:name="${'weeks-' + stat.index}"
                                value="2" />
                              <label th:for="${'2-week-' + stat.index}">2주</label>
                              <input type="radio" th:id="${'3-week-' + stat.index}" th:name="${'weeks-' + stat.index}"
                                value="3" />
                              <label th:for="${'3-week-' + stat.index}">3주</label>
                              <input type="radio" th:id="${'4-week-' + stat.index}" th:name="${'weeks-' + stat.index}"
                                value="4" checked />
                              <label th:for="${'4-week-' + stat.index}">4주</label>
                            </div>
                          </td>
                        </tr>

                      </tbody>

                    </table>
                  </div>
                </div>
              </div>
            </section>
            <div th:replace="~{class/timetable-right :: studentPickRight} "></div>
            <script>


            </script>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>

</html>
