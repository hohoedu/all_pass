<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Custom Css / Js -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/media.css}">
    <script th:src="@{/js/custom.js}"></script>
    <script th:src="@{/js/class/timeview.js}"></script>
    <!-- Html menu Load -->
    <script th:src="@{/js/sidebar.js}"></script>
    <title>시간표 조회</title>
</head>

<body>
<div class="main-container" style="height: auto;">
    <div class="main-frame">
        <!-- left nav bar -->
        <aside id="sidebar-load" th:replace="~{sidebar :: sidebar}"></aside>
        <main class="main-info timeview">
            <div class="line-second-frame">
                <!-- 시간표 조회 -->
                <section class="time-table-index">
                    <div class="manager-list-frame">
                        <div class="top-flex">
                            <div class="common-title">
                                <h2>시간표 조회</h2>
                            </div>
                            <a class="print" id="time-view-print">인쇄</a>
                        </div>
                        <div class="month-header">
                            <div class="month-title">
                                <span class="current-month" id="currentMonth"></span>
                                <div style="position: relative;">
                                    <div class="calendar-wrapper">
                                        <input type="month" id="monthPickerInput" style="position:absolute; opacity:0; width:0; height:0;">
                                        <button type="button" class="icon-btn calendar-open" id="openMonthPicker">
                                            <img th:src="@{/image/calendar.png}" alt="달력 아이콘">
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="basic-select">
                                <select name="teacher" id="teacher-select" style="width: 200px;">
                                    <option th:each="u : ${users}"
                                            th:value="${u.userCode}"
                                            th:text="${u.userName}"
                                            th:selected="${u.userCode == selectedUserCode}">
                                    </option>
                                </select>
                            </div>
                        </div>
                        <!-- table -->
                        <table class="timetable-lookup-table">
                            <thead>
                            <tr>
                                <th style="padding: 0;">교시</th>
                                <th th:each="day : ${days}" th:text="${day.label}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="periodNo : ${#numbers.sequence(1,6)}">
                                <td th:text="${periodNo}">1</td>
                                <td th:each="day : ${days}" th:with="dayMap=${tableMap[day.id]}" style="height: 150px;">
                                    <div th:if="${dayMap != null and dayMap[periodNo.toString()] != null}"
                                         th:with="tt=${dayMap[periodNo.toString()]}">
                                        <div th:class="timetable-lookup-box" th:classappend="${tt.classType eq '1'} ? ' pink' : ' blue'">
                                            <div class="header" th:utext="${tt.startTime} + ' ~ ' + ${tt.endTime} + '<br>
                            <strong>' + ${tt.className} + ' ' +(${tt.unitName} ?: '') + '</strong>'">
                                            </div>
                                            <div class="inner-grid" draggable="true"
                                                 th:attr="data-time-table-key=${tt.timeTableKey}">
                                                <div th:each="stu : ${tt.students}" th:text="${stu.studentName}"
                                                     th:attr="data-name=${stu.studentName},
                                                     data-student-id=${stu.studentId},
                                                     data-week-no=${stu.week}">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
                <!-- 회원현황 -->
                <section class="member">
                    <div class="common-title" style="margin-bottom: 30px;">
                        <h2>회원 현황</h2>
                    </div>
                    <table class="member-status-table">
                        <tbody>
                        <tr>
                            <td>입회</td>
                            <td th:text="${statsMap['entry'] != null ? statsMap['entry'].size() : 0} +'명'">0</td>
                            <td>
                                <span th:each="stat, iterStat : ${statsMap['entry']}" th:if="${statsMap['entry'] != null}">
                                    <span th:text="${stat.studentName}"></span><span th:if="${!iterStat.last}">, </span>
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <td>탈퇴</td>
                            <td th:text="${statsMap['withdraw'] != null ? statsMap['withdraw'].size() : 0} +'명'">0</td>
                            <td>
                                <span th:each="stat, iterStat : ${statsMap['withdraw']}" th:if="${statsMap['withdraw'] != null}">
                                    <span th:text="${stat.studentName}"></span><span th:if="${!iterStat.last}">, </span>
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <td>전입</td>
                            <td th:text="${statsMap['move_in'] != null ? statsMap['move_in'].size() : 0} +'명'">0</td>
                            <td>
                                <span th:each="stat, iterStat : ${statsMap['move_in']}" th:if="${statsMap['move_in'] != null}">
                                    <span th:text="${stat.studentName}"></span><span th:if="${!iterStat.last}">, </span>
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <td>전출</td>
                            <td th:text="${statsMap['move_out'] != null ? statsMap['move_out'].size() : 0} +'명'">0</td>
                            <td>
                                <span th:each="stat, iterStat : ${statsMap['move_out']}" th:if="${statsMap['move_out'] != null}">
                                    <span th:text="${stat.studentName}"></span><span th:if="${!iterStat.last}">, </span>
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <td>1-3주</td>
                            <td th:text="${statsMap['week'] != null ? statsMap['week'].size() : 0} +'명'">0</td>
                            <td>
                                <span th:each="stat, iterStat : ${statsMap['week']}" th:if="${statsMap['week'] != null}">
                                    <span th:text="${stat.studentName} +' '+ ${stat.week}"></span><span th:if="${!iterStat.last}">, </span>
                                </span>
                            </td>
                        </tr>
                        <!--                        <tr>-->
                        <!--                            <td>주의필요</td>-->
                        <!--                            <td></td>-->
                        <!--                            <td></td>-->
                        <!--                        </tr>-->
                        </tbody>
                        <tfoot>
                        <tr>
                            <td colspan="2">총원</td>
                            <td><span class="pax-people" th:text="${totalStudents} + '명'"></span></td>
                        </tr>
                        </tfoot>
                    </table>
                </section>
            </div>
        </main>
    </div>
</div>
</body>

</html>
