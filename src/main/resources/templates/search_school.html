<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Custom Css / Js -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
    <script src="js/custom.js"></script>
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="js/signature.js"></script>
    <title>학교 찾기</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
      }
  
      .popup {
        background: #fff;
        padding: 30px;
        width: 100%;
        max-width: 480px;
        margin: auto;
      }
  
      h2 {
        font-size: 1.3rem;
        margin-bottom: 16px;
        text-align: center;
      }
  
      .form-group {
        margin-bottom: 16px;
      }
  
      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.95rem;
        font-weight: bold;
      }
  
      select, input[type="text"] {
        width: 100%;
        padding: 10px;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
  
      .btn {
        display: inline-block;
        background: #334DD7;
        color: white;
        border: none;
        padding: 12px;
        font-size: 1rem;
        width: 100%;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 20px;
      }
  
      .btn:hover {
        background: #253dbb;
      }
  
      /* 검색 결과 리스트 */
      .result-list {
        border-top: 1px solid #ddd;
        max-height: 250px;
        overflow-y: auto;
      }
  
      .result-item {
        padding: 12px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
      }
  
      .result-item:hover {
        background: #f1f1f1;
      }
  
      .no-result {
        padding: 20px;
        text-align: center;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <h2>학교 찾기</h2>
      
      <div class="form-group">
        <label for="province">시/도 선택</label>
        <select id="province">
          <option>서울특별시</option>
          <option>부산광역시</option>
          <option>대구광역시</option>
          <option>인천광역시</option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="city">시/군/구 선택</label>
        <select id="city">
          <option>강남구</option>
          <option>서초구</option>
          <option>송파구</option>
          <option>마포구</option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="school">학교 이름</label>
        <input type="text" id="school" placeholder="학교명을 입력하세요">
      </div>
  
      <button class="btn">검색하기</button>
  
      <!-- 검색 결과 영역 -->
      <div class="result-list">
        <!-- 검색 결과 없을 때 -->
        <div class="no-result">검색 결과가 없습니다.</div>
  
        <!-- 검색 결과 있을 때 -->
        
        <div class="result-item">서울 강남고등학교</div>
        <div class="result-item">서울 강남중학교</div>
        <div class="result-item">서울 강남초등학교</div>
      </div>
    </div>
  </body>
</html>
